[package]
name = "recall-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Recall's sync server: SQLite persistence, LLM-assisted merge, and the HTTP API"

# The server binary, since 0.4.0. Named here rather than inferred for the
# reason the client names its own: the Dockerfile, the release archives and
# every deployment's compose file invoke it by this name.
[[bin]]
name = "recall-server"
path = "src/main.rs"

[dependencies]
recall-wire.workspace = true

anyhow.workspace = true
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# The Merkle tree hash for the audit log (RFC 9162 §2.1.1). Already in the
# workspace through recall-wire.
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
# io-util is needed to stream the merge prompt into the CLI's stdin.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tempfile.workspace = true
# Only to drive the Router in tests without binding a real socket.
tower = { version = "0.5", features = ["util"] }
