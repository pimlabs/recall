[package]
name = "recall-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Recall's sync server: SQLite persistence, LLM-assisted merge, and the HTTP API"

# The server binary, since 0.4.0. Named here rather than inferred for the
# reason the client names its own: the Dockerfile, the release archives and
# every deployment's compose file invoke it by this name.
[[bin]]
name = "recall-server"
path = "src/main.rs"

[dependencies]
recall-wire.workspace = true
# Only for the inline merge a server without a worker still runs. Built
# without the worker's `client` feature, so no HTTP client comes with it.
recall-worker.workspace = true

anyhow.workspace = true
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# The Merkle tree hash for the audit log (RFC 9162 §2.1.1). Already in the
# workspace through recall-wire.
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
unicode-normalization.workspace = true
unicode-security.workspace = true
# io-util is needed to stream the merge prompt into the CLI's stdin.
tokio = { workspace = true, features = ["io-util"] }

# Direct TLS (server/tls.rs), both modes off unless configured. Only this
# crate uses any of these; see the workspace Cargo.toml for the `ring`
# choice.
rustls.workspace = true
axum-server.workspace = true
rustls-acme.workspace = true
futures-util.workspace = true
hyper-util.workspace = true
tower-service.workspace = true
http-body.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The end-to-end test: a real worker, client and all, against this server
# on a real socket. Tests only, so the server binary still has no client.
recall-worker = { workspace = true, features = ["client"] }
reqwest.workspace = true
# Only to drive the Router in tests without binding a real socket.
tower = { version = "0.5", features = ["util"] }
# Only for server/tls.rs's tests: a self-signed certificate to serve, and a
# TLS client to hold connections open against it. Both already in the tree
# (through rustls-acme and axum-server), and both with aws-lc-rs left out.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
