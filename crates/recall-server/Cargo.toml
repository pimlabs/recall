[package]
name = "recall-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Recall's sync API: SQLite persistence, LLM-assisted merge, and the HTTP surface"

[dependencies]
recall-wire.workspace = true

anyhow.workspace = true
axum.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# io-util is needed to stream the merge prompt into the CLI's stdin.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tempfile.workspace = true
# Only to drive the Router in tests without binding a real socket.
tower = { version = "0.5", features = ["util"] }
