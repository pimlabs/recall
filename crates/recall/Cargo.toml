[package]
name = "recall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sync Claude Code's auto memory across machines and cloud sessions"
# The root README is the one that is already maintained; pointing at it keeps
# the crates.io page from becoming a second copy that drifts.
readme = "../../README.md"

# Redundant with the package name, and kept anyway. The binary name is
# load-bearing in a way the package name is not: it is what `install.sh`,
# the npm shim, the Homebrew formula and — above all — the hook commands
# committed into users' `.claude/settings.json` all invoke. Pinning it here
# means a future package rename cannot quietly rename the binary, which is
# the mistake this crate's own history is made of.
[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
recall-wire.workspace = true
recall-hooks.workspace = true
anyhow.workspace = true
clap.workspace = true
anstream.workspace = true
anstyle.workspace = true
cliclack.workspace = true
console.workspace = true
serde.workspace = true
serde_json.workspace = true
# For one question: how long ago the off-box backup last succeeded. A raw
# timestamp in the report would leave the reader doing date arithmetic, which
# is how a stale backup goes unnoticed in plain sight.
time.workspace = true
tokio.workspace = true

[dev-dependencies]
# The integration tests start a real server in-process. A dev-dependency,
# so the binary users install still carries no server.
recall-server.workspace = true
tempfile.workspace = true
# A stand-in server for what the real one cannot be made to do: be a
# release from before devices, or record exactly what approving sent.
# Already in the tree through recall-server.
axum.workspace = true
