[package]
name = "recall-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The request/response contract shared by Recall's client and server"

[dependencies]
serde.workspace = true
# The discovery document's capabilities are open-ended objects, kept as
# JSON values so a key this build does not know still reads.
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Request signatures: Ed25519 keys, and the base64 their encodings use.
# Here rather than in each half so the client and the server sign and
# verify with one implementation.
base64.workspace = true
ed25519-dalek.workspace = true

