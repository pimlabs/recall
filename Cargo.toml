[workspace]
resolver = "2"
members = [
    "crates/recall-wire",
    "crates/recall-hooks",
    "crates/recall-server",
    "crates/recall",
]

# Shared across every crate so versions can't drift between the halves.
[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/pimlabs/recall"

[workspace.dependencies]
recall-wire = { path = "crates/recall-wire", version = "0.4.0" }
recall-hooks = { path = "crates/recall-hooks", version = "0.4.0" }
recall-server = { path = "crates/recall-server", version = "0.4.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a user's .claude/settings.json key order intact when
# `recall init` edits it — that file is committed and reviewed, so silently
# re-sorting it would turn a two-line change into a whole-file diff.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "fs"] }
axum = "0.8"
# rustls rather than native-tls: no OpenSSL to find or cross-compile against.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# recall-server's own direct-TLS mode (optional; off unless RECALL_TLS_CERT
# or RECALL_TLS_ACME_DOMAINS is set). `ring`, not the default `aws-lc-rs`:
# aws-lc-rs needs cmake and a C++ toolchain to build its own copy of
# BoringSSL, and the server's release build is static musl, cross-compiled
# with nothing but musl-gcc (release.yml). Nothing may bring aws-lc-rs or
# OpenSSL back in: `cargo tree -p recall-server -e normal | grep -iE "aws|openssl"`
# must print nothing.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tokio", "axum", "tls12", "webpki-roots"] }
# Only for AcmeState::next(), which drives certificate issuance/renewal.
futures-util = { version = "0.3", default-features = false }
# Named directly only to configure the connection timeouts axum-server's
# builder takes (TokioTimer, and the auto builder's type), and to wrap the
# per-connection service and response body; all three are already in the
# tree through axum and axum-server, at these versions.
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto"] }
tower-service = "0.3"
http-body = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tempfile = "3"
# The content hash a push names its base by. Both halves compute it, which is
# why it lives in recall-wire.
sha2 = "0.10"
# ~/.recall/config.toml and credentials.toml: files a person reads and edits.
toml = "1"
# The human-facing output: colour that turns itself off when stdout is not a
# terminal or NO_COLOR is set. Both already in the tree through clap.
anstream = "1"
anstyle = "1"
# `recall connect`'s prompts: the token read without echo, the name, the
# questions, and a spinner while the server answers.
cliclack = "0.5"
# The styling type cliclack's theme hooks take; already in the tree through it.
console = "0.16"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
