[workspace]
resolver = "2"
members = [
    "crates/recall-wire",
    "crates/recall-hooks",
    "crates/recall-worker",
    "crates/recall-server",
    "crates/recall",
]

# Shared across every crate so versions can't drift between the halves.
[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pimlabs/recall"

[workspace.dependencies]
recall-wire = { path = "crates/recall-wire", version = "0.4.2" }
recall-hooks = { path = "crates/recall-hooks", version = "0.4.2" }
# Without its default features, so a crate that depends on the server only to
# run one in its tests (the client does) does not build the passkey support
# and the OpenSSL under it. Built as itself (`-p recall-server`, or as part
# of the workspace), the server has them.
recall-server = { path = "crates/recall-server", version = "0.4.2", default-features = false }
# Without its HTTP client by default: recall-server uses only its merge
# code. recall-worker's own binary turns `client` back on.
recall-worker = { path = "crates/recall-worker", version = "0.4.2", default-features = false }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a user's .claude/settings.json key order intact when
# `recall init` edits it — that file is committed and reviewed, so silently
# re-sorting it would turn a two-line change into a whole-file diff.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "fs"] }
axum = "0.8"
# rustls rather than native-tls: no OpenSSL to find or cross-compile against.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# recall-server's own direct-TLS mode (optional; off unless RECALL_TLS_CERT
# or RECALL_TLS_ACME_DOMAINS is set). `ring`, not the default `aws-lc-rs`:
# aws-lc-rs needs cmake and a C++ toolchain to build its own copy of
# BoringSSL, and the server's release build is static musl, cross-compiled
# with nothing but musl-gcc (release.yml). Nothing may bring aws-lc-rs or
# OpenSSL back in: `cargo tree -p recall-server -e normal | grep -iE "aws|openssl"`
# must print nothing.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tokio", "axum", "tls12", "webpki-roots"] }
# Only for AcmeState::next(), which drives certificate issuance/renewal.
futures-util = { version = "0.3", default-features = false }
# Named directly only to configure the connection timeouts axum-server's
# builder takes (TokioTimer, and the auto builder's type), and to wrap the
# per-connection service and response body; all three are already in the
# tree through axum and axum-server, at these versions.
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto"] }
tower-service = "0.3"
http-body = "1"
# 0.39 for the SQLite it bundles, 3.51.3: the first with the fix for a race
# in which a checkpoint on one connection and a write that wraps the WAL
# on another could copy stale frames into the database (SQLite check-in
# 5aadfbbdd8, "Avoid an obscure race condition between a checkpointer and
# a writer wrapping around to the start of the wal file"). The store is in
# WAL, and the server checkpoints while `recall-server admin` writes from
# its own connection, so that is a race this server can run. Older
# bundles, 3.46.0 until this, have the bug.
rusqlite = { version = "0.39", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tempfile = "3"
# The content hash a push names its base by. Both halves compute it, which is
# why it lives in recall-wire.
sha2 = "0.10"
# Device keys and request signatures (RFC 9421). Pure Rust, so the server
# still builds static against musl with no C crypto library to find.
ed25519-dalek = "2"
# Tests only: the scalar arithmetic that builds a signature ed25519-dalek
# would never make, to prove strict verification refuses it. Already in the
# tree through ed25519-dalek.
curve25519-dalek = "4"
# Public keys, Content-Digest and Signature values on the wire.
base64 = "0.22"
# Device ids, enrolment codes and authkeys on the server. The same
# version tempfile already brings in.
getrandom = "0.4"
# Device names compared the way a person reads them: normalized, then by
# Unicode's confusable skeleton (UTS #39), so `lаptop` with a Cyrillic `а`
# cannot stand beside `laptop`. Both from unicode-rs, pure Rust, no build
# script; the server only, so the client carries neither table.
unicode-normalization = "0.1"
unicode-security = "0.1"
# ~/.recall/config.toml and credentials.toml: files a person reads and edits.
toml = "1"
# The human-facing output: colour that turns itself off when stdout is not a
# terminal or NO_COLOR is set. Both already in the tree through clap.
anstream = "1"
anstyle = "1"
# `recall connect`'s prompts: the token read without echo, the name, the
# questions, and a spinner while the server answers.
cliclack = "0.5"
# The styling type cliclack's theme hooks take; already in the tree through it.
console = "0.16"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The curve arithmetic under every Ed25519 signature, built for speed
# rather than size. At "z" the server spent about 3 ms of CPU verifying each
# signed request, on the path of every push hook; at 3 it spends about
# 0.3 ms, for under 5 KB more in the client and 1.5 KB in the server.
[profile.release.package.curve25519-dalek]
opt-level = 3
