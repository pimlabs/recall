name: Deploy a release

# Puts a release on the server. A server runs releases, not `main`: its
# image holds the recall-server that release published, checked against the
# release's own checksums (deploy/Dockerfile). Every release after 0.4.6
# builds that image once, in the Release workflow, and publishes it to GHCR
# (release.yml's `publish-image`); the server pulls it. 0.4.6 and older have
# no published image, and the server builds theirs for itself, as it always
# did. LAST_BUILT_ON_SERVER below is where the two meet.
#
# Two ways in:
#
#   - release.yml calls it once the GitHub Release and its images exist,
#     with that release's version. Every release deploys itself.
#   - Actions → Deploy a release → Run workflow, with a version. For a rollback, or to
#     retry a deploy that failed, from anywhere including the GitHub mobile
#     app. An older tag deploys the way that tag did: 0.4.6 and older build
#     their image on the server, and before 0.4.0 that image compiled the
#     server from source.
#
# Needs DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY as repo secrets and
# DEPLOY_COMPOSE_FILES as a variable; see docs/reference/github-actions-deploy.md.
on:
  workflow_call:
    inputs:
      version:
        description: "The release to deploy, without the v"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release to deploy again, e.g. 0.4.5 to roll back (its tag v0.4.5 must exist)"
        required: true

permissions:
  contents: read

jobs:
  production:
    name: production
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and a deploy that has started always finishes.
    # On 2026-09-22 two deploys rebuilt the same stack at once and the loser
    # failed on a container-name conflict. A newer deploy that arrives while
    # one is waiting replaces the waiting one, which is what should happen:
    # the newest version asked for is the one to end on.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      # The last release with no image in GHCR, deployed by building its
      # image on the server (`docker compose up -d --build`). Every release
      # after it publishes ghcr.io/pimlabs/recall-server:<version> and
      # recall-worker:<version>, and is deployed by pulling them. Tags never
      # move, so this never changes: a rollback to 0.4.6 or older builds, as
      # those releases always did.
      LAST_BUILT_ON_SERVER: 0.4.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version reaches a shell on the server, so it is held to the shape
      # a release version has before anything else sees it, and the tag has
      # to exist: a typo fails here, not halfway through a rebuild.
      - name: Is it a release?
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a release version like 0.4.0 (no v, no suffix)."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::There is no tag v$VERSION. Deploy a version that has been released."
            exit 1
          fi

      # Pulled or built, decided here and nowhere else, from the version
      # alone: see LAST_BUILT_ON_SERVER above.
      - name: Pulled or built on the server?
        id: how
        run: |
          newer=$(printf '%s\n%s\n' "$LAST_BUILT_ON_SERVER" "$VERSION" | sort -V | tail -n 1)
          if [ "$VERSION" != "$LAST_BUILT_ON_SERVER" ] && [ "$newer" = "$VERSION" ]; then
            echo "mode=pull" >> "$GITHUB_OUTPUT"
            echo "$VERSION is after $LAST_BUILT_ON_SERVER: the server pulls its published image."
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "$VERSION is $LAST_BUILT_ON_SERVER or older: it has no published image, so the server builds it, as that release did."
          fi

      # Not having the deploy secrets is a normal state, not a failure: a
      # fork, a clone, or this repository before a server was wired up. A
      # workflow that is always red is a workflow nobody reads.
      #
      # The secrets context is not available in a job-level `if`, so the
      # check has to be a step.
      - name: Are the deploy secrets configured?
        id: secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST is not set, so there is nothing to deploy to. This is not a failure — see docs/reference/github-actions-deploy.md to wire up a server."
          fi

      # This repository ships two ingresses, so the job cannot know which
      # compose files a given deployment is built from, and guessing is worse
      # than refusing. With no `-f`, compose acts on docker-compose.yml: on a
      # host running the Traefik stack that quietly starts the *other*
      # ingress alongside the real one.
      - name: Is the compose file named?
        if: steps.secrets.outputs.configured == 'true'
        run: |
          if [ -z "${{ vars.DEPLOY_COMPOSE_FILES }}" ]; then
            echo "::error::DEPLOY_HOST is set but DEPLOY_COMPOSE_FILES is not, so this job does not know which ingress your server runs and will not guess. Set it as a repository variable, e.g. '-f docker-compose.traefik.yml -f docker-compose.traefik.local.yml'. See docs/reference/github-actions-deploy.md."
            exit 1
          fi

      # Asked from here, before the server is touched, and asked the way the
      # server will ask: with no credentials. A package the release created
      # starts private, so the first release to publish one stops here
      # until it is made public, with the server still on the version it
      # was on. The worker's image only warns: the server pulls it only if
      # it runs the worker, which this runner cannot see, and the pull on
      # the server fails loudly by itself if it does.
      - name: Can the server pull the image?
        if: steps.secrets.outputs.configured == 'true' && steps.how.outputs.mode == 'pull'
        run: |
          if ! scripts/image-pullable.sh "ghcr.io/pimlabs/recall-server:$VERSION"; then
            echo "::error::The server cannot pull ghcr.io/pimlabs/recall-server:$VERSION without credentials, so nothing was deployed and production is still on the version it was on. If the package is private, make it public once (https://github.com/orgs/pimlabs/packages/container/recall-server/settings, Change visibility), then re-run this job. If the tag is missing, re-run the release's publish-image job first. See docs/reference/github-actions-deploy.md."
            exit 1
          fi
          if ! scripts/image-pullable.sh "ghcr.io/pimlabs/recall-worker:$VERSION"; then
            echo "::warning::ghcr.io/pimlabs/recall-worker:$VERSION cannot be pulled without credentials. A server that runs the worker (COMPOSE_PROFILES=worker) will fail to deploy until it can; make that package public too (https://github.com/orgs/pimlabs/packages/container/recall-worker/settings)."
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd "${DEPLOY_PATH:-$HOME/recall}"
            # The compose files (and, for a build, the Dockerfile) come
            # from the release's own tag, so a deploy of 0.4.0 runs exactly
            # the way 0.4.0 says. A checkout with local changes to tracked
            # files refuses to move, which is a signal to go and look, not
            # something this workflow should overwrite. Untracked files,
            # such as a local compose override, are left where they are.
            git fetch --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            git checkout --detach "v$VERSION"
            cd deploy
            # The tag's compose files name the images by this version.
            export RECALL_VERSION="$VERSION"
            GIT_COMMIT=$(git rev-parse --short HEAD)
            export GIT_COMMIT

            if [ "$DEPLOY_MODE" = pull ]; then
              # Each image of ours this stack runs, as the tag's compose
              # files name it: the server's, and the worker's where
              # COMPOSE_PROFILES in .env turns the worker on. Pulled one by
              # one before anything is stopped, so a pull that fails leaves
              # every running container as it was. Compose is asked on its
              # own first, so a compose file or .env it cannot read stops
              # the deploy with compose's own error, rather than reading as
              # a stack with no images of ours.
              if ! all=$(docker compose $COMPOSE_FILES config --images); then
                echo "docker compose could not read the compose files at v$VERSION (its error is above), so nothing was changed." >&2
                exit 1
              fi
              images=$(printf '%s\n' "$all" | grep '^ghcr\.io/pimlabs/' || true)
              if [ -z "$images" ]; then
                echo "The compose files at v$VERSION name no ghcr.io/pimlabs image, so there is nothing to pull." >&2
                exit 1
              fi
              for image in $images; do
                if ! docker pull "$image"; then
                  echo "Could not pull $image, so nothing was changed: the running containers are as they were." >&2
                  echo "If the pull was denied, the package is private. Make it public once in its package settings (Change visibility), then deploy again; see docs/reference/github-actions-deploy.md." >&2
                  exit 1
                fi
              done
              # Once every pull has worked: the same bytes under `:local`,
              # the name the compose files fall back to when RECALL_VERSION
              # is unset. A `docker compose up -d` typed on this machine
              # later then runs the version deployed here, rather than
              # building one or finding an older `:local`.
              for image in $images; do
                docker tag "$image" "${image%:*}:local"
              done
              # --no-build: every image is here now, and one that is not
              # should fail this deploy, not be built on the server.
              docker compose $COMPOSE_FILES up -d --no-build
            elif [ "$DEPLOY_MODE" = build ]; then
              docker compose $COMPOSE_FILES up -d --build
            else
              echo "DEPLOY_MODE is '$DEPLOY_MODE', not pull or build, so nothing was changed." >&2
              exit 1
            fi

            # Asked from inside the container, because neither compose file
            # publishes 8787 to the host: both use `expose`, deliberately,
            # so nothing can reach the origin around the ingress.
            sleep 5
            docker compose $COMPOSE_FILES exec -T recall-server \
              wget -qO- http://127.0.0.1:8787/health
          envs: DEPLOY_PATH,COMPOSE_FILES,VERSION,DEPLOY_MODE
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMPOSE_FILES: ${{ vars.DEPLOY_COMPOSE_FILES }}
          DEPLOY_MODE: ${{ steps.how.outputs.mode }}

      # Whichever way the steps above went, say what production is actually
      # running, on the run's summary page, where it is read. A green tick
      # that means "did not deploy" is the same shape of bug as a test that
      # cannot fail: on 2026-09-18 every run was green and the server stayed
      # twenty-five commits behind.
      #
      # It asks the discovery document, which names the version and whether
      # it is a release, and falls back to /health's commit for a server
      # older than the document. Unauthenticated either way. It fails the
      # job only when this run deployed and production does not say so.
      - name: What is production actually running?
        if: always()
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          DEPLOYED: ${{ steps.secrets.outputs.configured }}
        run: |
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -z "$HEALTH_URL" ]; then
            say "### Production was not asked"
            say ""
            say "No \`DEPLOY_HEALTH_URL\` repository variable, so this run cannot"
            say "say what the server is running. Set it to the \`/health\` URL."
            exit 0
          fi

          discovery="${HEALTH_URL%/health}/.well-known/recall"
          live=""
          for _ in 1 2 3 4 5 6; do
            if body="$(curl -fsS --max-time 20 "$discovery")"; then
              live="$(printf '%s' "$body" | jq -r '.server.version // empty')"
              channel="$(printf '%s' "$body" | jq -r '.server.build.channel // empty')"
              [ "$live" = "$VERSION" ] && break
            fi
            sleep 10
          done

          if [ -z "$live" ]; then
            commit="$(curl -fsS --max-time 20 "$HEALTH_URL" | jq -r '.git_commit // empty' || true)"
            say "### Production did not say its version"
            say ""
            say "\`$discovery\` did not answer with one. \`/health\` reports commit"
            say "\`${commit:-nothing}\`, so it may be older than 0.4.0, down, or behind"
            say "an ingress that is failing."
          elif [ "$live" = "$VERSION" ]; then
            say "### Production is running $VERSION"
            say ""
            say "\`$live\`, a \`$channel\` build."
            exit 0
          else
            say "### Production is NOT running $VERSION"
            say ""
            say "| | version |"
            say "|---|---|"
            say "| production | \`$live\` ($channel) |"
            say "| this deploy | \`$VERSION\` |"
          fi

          if [ "$DEPLOYED" = "true" ]; then
            echo "::error::deployed $VERSION, but production reports ${live:-no version}"
            exit 1
          fi
          echo "::warning::production is not running $VERSION"
