name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

# Pushing again to a pull request makes the run for the commit it replaced
# worthless: nobody is waiting on an answer about a commit that is no longer
# the branch tip. PR #64 took four pushes and ran all four to completion — 198s,
# 216s, 209s, 183s — and only the last one was being read. The minutes matter
# less than the queue: three dead runs sit in front of the live one.
#
# `deploy` must never be cancelled. It SSHes to the VPS and runs
# `docker compose up -d --build`; interrupted halfway that leaves production
# part-way through a rebuild, which is a far worse outcome than any number of
# wasted runner-minutes. So this must cancel pull-request runs and nothing else.
#
# Two independent things keep a push to `main` out of the way, because one
# would be relying on the other never being edited:
#
#   - The group. A pull_request run is keyed by its PR number, so the four runs
#     on PR #64 share `CI & Deploy-pr-64` and supersede one another. Anything
#     else is keyed by `github.run_id`, which is unique per run — so a push to
#     main is alone in its group and there is no other run for it to be
#     cancelled by, whatever `cancel-in-progress` says.
#   - `cancel-in-progress`, which is only true for a pull_request event.
#
# `github.ref` is the usual key and would also separate the two (a PR run's ref
# is `refs/pull/64/merge`, a main push's is `refs/heads/main`), but it separates
# them by accident of naming rather than on purpose: with `cancel-in-progress:
# true` alongside it, two pushes landing on main in quick succession share the
# group `refs/heads/main` and the first deploy is killed mid-flight. That is the
# exact failure this block exists to make unreachable, so the condition it turns
# on is named here instead of inferred from a ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('uncancellable-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # The same tests again with TMPDIR behind a symlink, which is what
      # macOS has by default: its per-user temporary directory lives under
      # /var, a symlink to /private/var. The binary finds its project root
      # with `git rev-parse --show-toplevel`, and git resolves symlinks — so
      # a fixture built from the unresolved spelling and a path the binary
      # prints are different strings. Seven tests could not pass on macOS
      # while this runner stayed green, because /tmp here is a real directory
      # and both spellings agree. One symlink is the entire difference, so
      # the runner may as well have one.
      - name: cargo test, with TMPDIR behind a symlink (what macOS has)
        run: |
          mkdir -p "$RUNNER_TEMP/real"
          ln -sfn "$RUNNER_TEMP/real" "$RUNNER_TEMP/link"
          TMPDIR="$RUNNER_TEMP/link" cargo test --workspace --locked

      # `missing_docs` is denied in each library crate, so an undocumented
      # public item already fails the build above. This catches the other
      # half: a doc comment that links to something that no longer exists.
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # docs/reference/api.md describes a frozen compatibility surface, so it is
      # asserted rather than trusted: status codes, error wording, field
      # order, and the null-versus-empty-string distinction, against a real
      # server on a real socket.
      - name: API reference still matches the server
        run: |
          cargo build --release -p recall --locked
          ./scripts/api-doc-check.sh target/release/recall

      # Rate limiting runs before auth, so the bucket key is a security
      # boundary: a client that can pick its own gets unlimited attempts at
      # the token. Driven on a real socket, because the unit tests only cover
      # client_ip in isolation.
      - name: Rate-limit bucket cannot be chosen by the client
        run: |
          cargo build --release -p recall --locked
          ./scripts/trusted-ip-check.sh target/release/recall

      # The Worker that publishes recall.pimlabs.id/install. Its routing is
      # easy to get subtly wrong in ways no one would notice: a redirect
      # where a 410 belongs would forward a stale client's POST /sync to a
      # host it never authenticated against, and an upstream failure served
      # as 200 would pipe a truncated script into someone's shell.
      - name: Install worker still routes correctly
        run: |
          node scripts/install-worker-test.js
          python3 scripts/wrangler-check.py

      # Not a style check. The doc set has been reorganised twice — `docs/`
      # split into reference/ and history/, `tests/` renamed to `fixtures/` —
      # and a link left pointing at nothing is exactly what neither move
      # would have announced.
      - name: Documentation links still resolve
        run: python3 scripts/link-check.py

      - name: Shipped shell scripts still parse
        run: |
          bash -n install.sh
          bash -n scripts/compat-check.sh
          bash -n scripts/api-doc-check.sh
          bash -n scripts/trusted-ip-check.sh
          bash -n scripts/release.sh
          bash -n deploy/backup-offbox.sh
          bash -n scripts/backup-offbox-check.sh
          bash -n .claude/hooks/session-start.sh

      # The off-box backup runs against a stub rclone, so it needs no bucket
      # and no credentials. What it asserts cannot be seen from the script's
      # output: a run that wrongly deleted the remote and one that did not
      # look identical from here.
      - name: Off-box backup never asks rclone to delete
        run: ./scripts/backup-offbox-check.sh

      # 124 seconds of a 177-second run — 70% of the whole thing — went into
      # the step below, on runs that could not possibly have learned anything
      # from it. Of the eight pull requests merged on 2026-09-18, five (#58,
      # #61, #62, #63, #64) changed only documentation, a Homebrew formula,
      # shell scripts and this workflow, and each paid the full 124s. So on a
      # pull request the image is built only when the diff touches something
      # it is built from.
      #
      # On a push to main it is built unconditionally, whatever the diff says.
      # That asymmetry is the entire safety argument and is not an oversight:
      # the list of paths below is a guess about what the image depends on,
      # and a guess this cheap will eventually be wrong. `.dockerignore`
      # decides what even reaches the daemon; a future Dockerfile could COPY
      # something nobody thought to list here. When the filter turns out too
      # narrow, the miss surfaces as a red build on main — before the deploy
      # job, which `needs: ci`, has run — rather than as a broken image on the
      # server. Skipping on main too would trade that for finding out from
      # production, which is the failure this step exists to prevent.
      #
      # `paths:` under `on:` would have been fewer lines and the wrong tool:
      # it skips the whole workflow, tests included, and a required check that
      # never runs leaves the PR blocked rather than passing.
      - name: Does this change touch the server image?
        id: image
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — the image builds unconditionally."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This job checks out at the default depth of 1. Deepening it to
          # fetch-depth: 0 would pull the entire history on every run to
          # answer one question about one commit; fetching that one commit
          # costs a second and leaves the rest of the job as it was. The
          # checkout of a pull request is the merge commit, so the two-dot
          # `diff base HEAD` is exactly what the PR does to the base tree.
          base='${{ github.event.pull_request.base.sha }}'
          if ! git cat-file -e "$base^{commit}" 2>/dev/null \
            && ! git fetch --no-tags --depth=1 origin "$base"; then
            # A force-push to the base branch can leave that commit
            # unreachable. A diff that cannot be read is not evidence of
            # nothing: build.
            echo "::warning::Could not reach base commit $base, so the server image is built rather than skipped."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames deliberately. With rename detection on, moving
          # crates/foo.rs to docs/foo.md is reported as the single path
          # docs/foo.md — the side of the move that matters here vanishes
          # from the list, and the change reads as docs-only.
          changed="$(git diff --no-renames --name-only "$base" HEAD)"
          echo "Changed in this pull request:"
          echo "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(crates/|deploy/|Cargo\.(toml|lock)$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            # One line on purpose — see the deploy job for why.
            echo "::notice::Nothing under crates/, deploy/, Cargo.toml or Cargo.lock changed, so the server image build was skipped. It runs unconditionally on every push to main."
          fi

      # The image the deployment actually builds. This is where a crate
      # rename slipped through once: the Dockerfile has no file extension and
      # was missed by the search that updated everything else.
      - name: Server image builds
        if: steps.image.outputs.build == 'true'
        run: |
          docker build -f deploy/Dockerfile -t recall-server-ci .

          # The deploy job asks the server for its health from *inside* this
          # image, since neither compose file publishes 8787 to the host. So
          # the tool it asks with has to exist in the image. Asserted here,
          # on the same image the deploy runs, rather than discovered on a
          # server — which is how the previous health check spent months
          # being impossible without anyone noticing.
          docker run --rm --entrypoint sh recall-server-ci -c 'command -v wget'

  # Only runs after CI passes, and only for a push that landed on main.
  # Needs DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY as repo secrets —
  # see docs/reference/github-actions-deploy.md.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history, because the last step counts how far behind production
      # is, and a shallow clone cannot see a commit from four days ago.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Not having the deploy secrets is a normal state, not a failure: a
      # fork, a clone, or this repository before the VPS was wired up. This
      # job used to fail on every push to main with "missing server host",
      # which meant main was permanently red — and a workflow that is always
      # red is a workflow nobody reads. It cost five PRs merged over a broken
      # build before anyone looked.
      #
      # The secrets context is not available in a job-level `if`, so the
      # check has to be a step.
      - name: Are the deploy secrets configured?
        id: secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            # One line on purpose. A `\` continuation inside a quoted
            # shell string keeps the next line's indentation, so the
            # annotation came out with runs of spaces in it.
            echo "::notice::DEPLOY_HOST is not set, so there is nothing to deploy to. This is not a failure — see docs/reference/github-actions-deploy.md to wire up a VPS."
          fi

      # This repository ships two ingresses, so the job cannot know which
      # compose files a given deployment is built from — and guessing is
      # worse than refusing. It used to run `docker compose up -d --build`
      # with no `-f`, which acts on docker-compose.yml: on a host running the
      # Traefik stack that quietly builds and starts the *other* ingress
      # alongside the real one.
      - name: Is the compose file named?
        if: steps.secrets.outputs.configured == 'true'
        run: |
          if [ -z "${{ vars.DEPLOY_COMPOSE_FILES }}" ]; then
            echo "::error::DEPLOY_HOST is set but DEPLOY_COMPOSE_FILES is not, so this job does not know which ingress your server runs and will not guess. Set it as a repository variable, e.g. '-f docker-compose.traefik.yml -f docker-compose.traefik.local.yml'. See docs/reference/github-actions-deploy.md."
            exit 1
          fi

      - name: Deploy over SSH
        id: ssh
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd "${DEPLOY_PATH:-$HOME/recall}"
            git fetch origin main
            git checkout main
            # --ff-only, not --hard: a fast-forward failure means something
            # changed on the VPS directly, which is a signal to go look, not
            # something this workflow should silently overwrite.
            git pull --ff-only origin main
            cd deploy
            GIT_COMMIT=$(git rev-parse --short HEAD) \
              docker compose $COMPOSE_FILES up -d --build

            # Asked from inside the container, because neither compose file
            # publishes 8787 to the host — both use `expose`, deliberately,
            # so nothing can reach the origin around the ingress. The old
            # check hit localhost:8787 on the VPS and could therefore never
            # have passed, which reads like a broken deploy when the deploy
            # in fact worked.
            sleep 5
            docker compose $COMPOSE_FILES exec -T recall-server \
              wget -qO- http://127.0.0.1:8787/health
          envs: DEPLOY_PATH,COMPOSE_FILES
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMPOSE_FILES: ${{ vars.DEPLOY_COMPOSE_FILES }}

      # Whichever way the steps above went, say what production is actually
      # running — on the run's summary page, where it is read, rather than in
      # a log nobody opens.
      #
      # The skip when DEPLOY_HOST is unset is right for a fork and invisible
      # for a repository that does have a server: on 2026-09-18 four pushes
      # landed on main, every run was green, and the VPS stayed on a build
      # from the 14th — twenty-five commits back — because this job reported
      # success while doing nothing. A green tick that means "did not deploy"
      # is the same shape of bug as a test that cannot fail.
      #
      # `/health` needs no auth and no secrets, so this works in both cases.
      # It never fails the job: deploying by hand is a legitimate choice, and
      # a workflow that goes red for a choice is a workflow that gets ignored.
      - name: What is production actually running?
        if: always()
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          PUSHED: ${{ github.sha }}
        run: |
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -z "$HEALTH_URL" ]; then
            say "### Production was not asked"
            say ""
            say "No \`DEPLOY_HEALTH_URL\` repository variable, so this run cannot"
            say "say what the server is running. Set it to the \`/health\` URL to"
            say "have every push report the live commit here."
            exit 0
          fi

          if ! body="$(curl -fsS --max-time 20 "$HEALTH_URL")"; then
            say "### Production did not answer"
            say ""
            say "\`$HEALTH_URL\` was unreachable. That may be the server, or the"
            say "ingress, or a transient network failure — this step does not"
            say "guess, and does not fail the job over it."
            exit 0
          fi

          live="$(printf '%s' "$body" | sed -n 's/.*"git_commit":"\([^"]*\)".*/\1/p')"
          if [ -z "$live" ]; then
            say "### Production answered without a commit"
            say ""
            say "\`/health\` returned no \`git_commit\`, so the build it is running"
            say "cannot be identified. A server started without \`GIT_COMMIT\` set"
            say "reports \`unknown\`; an empty field means something else."
            exit 0
          fi

          short="$(echo "$PUSHED" | cut -c1-7)"
          case "$live" in
            "$short"*|"$PUSHED")
              say "### Production is up to date"
              say ""
              say "Running \`$live\`, which is this push."
              ;;
            *)
              behind=""
              if git rev-parse --verify --quiet "$live^{commit}" >/dev/null 2>&1; then
                behind=" — $(git rev-list --count "$live..$PUSHED" 2>/dev/null) commits behind"
              fi
              say "### Production is NOT running this push"
              say ""
              say "| | commit |"
              say "|---|---|"
              say "| production | \`$live\`$behind |"
              say "| this push | \`$short\` |"
              say ""
              say "Expected if you deploy by hand. If you did not mean to, the"
              say "deploy secrets are the usual reason — see"
              say "\`docs/reference/github-actions-deploy.md\`."
              echo "::warning::production is running $live, not $short"
              ;;
          esac
