name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # `missing_docs` is denied in each library crate, so an undocumented
      # public item already fails the build above. This catches the other
      # half: a doc comment that links to something that no longer exists.
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # docs/api.md describes a frozen compatibility surface, so it is
      # asserted rather than trusted: status codes, error wording, field
      # order, and the null-versus-empty-string distinction, against a real
      # server on a real socket.
      - name: API reference still matches the server
        run: |
          cargo build --release -p recall-sync --locked
          ./scripts/api-doc-check.sh target/release/recall

      - name: Shipped shell scripts still parse
        run: |
          bash -n install.sh
          bash -n scripts/compat-check.sh
          bash -n scripts/api-doc-check.sh
          bash -n scripts/release.sh

      # The image the deployment actually builds. This is where a crate
      # rename slipped through once: the Dockerfile has no file extension and
      # was missed by the search that updated everything else.
      - name: Server image builds
        run: docker build -f deploy/Dockerfile -t recall-server-ci .

  # Only runs after CI passes, and only for a push that landed on main.
  # Needs DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY as repo secrets —
  # see docs/github-actions-deploy.md.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd "${DEPLOY_PATH:-$HOME/recall}"
            git fetch origin main
            git checkout main
            # --ff-only, not --hard: a fast-forward failure means something
            # changed on the VPS directly, which is a signal to go look, not
            # something this workflow should silently overwrite.
            git pull --ff-only origin main
            cd deploy
            GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
            sleep 5
            curl -sf http://localhost:8787/health
          envs: DEPLOY_PATH
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
