name: Build a release

# Tagged releases exist for one reason: npm, Homebrew and install.sh all
# need a fixed artifact to point at. This builds it: every client and server
# binary, the GitHub Release with checksums.txt, the server's images, and the
# deploy of those images to production. About seven minutes, with nobody
# asked anything.
#
# The registries are not here. npm, crates.io, the Homebrew tap and winget
# are published by publish.yml ("Publish a release"), run once a
# person decides, behind an approval per registry. They used to
# be jobs of this workflow, waiting for that approval inside its run, and
# GitHub counts a run's duration to its last job: a release that waited four
# hours for a tap read as a four-hour release. Two workflows, and each run
# lasts as long as its work.
#
# Started by start-release.yml ("Start a release") on the tag, or by a tag
# pushed from a laptop. Setup is in docs/reference/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  # Before the native builds, not after: npm's postinstall downloads the
  # release named after the package's *own* version, so a tag that disagrees
  # with npm/package.json ships a package that installs nothing — and it would
  # otherwise be discovered after twenty minutes of runner time.
  check-versions:
    name: check-versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.agree.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: The tag, Cargo.toml and npm/package.json agree
        id: agree
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          npm_v=$(grep -m1 '"version"' npm/package.json | cut -d'"' -f4)
          echo "tag $want | Cargo.toml $cargo_v | npm $npm_v"
          [ "$cargo_v" = "$want" ] || { echo "::error::Cargo.toml says $cargo_v, the tag says $want"; exit 1; }
          [ "$npm_v" = "$want" ]   || { echo "::error::npm/package.json says $npm_v, the tag says $want"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"

  build-client:
    name: build-client (${{ matrix.target }})
    needs: check-versions
    strategy:
      fail-fast: false
      matrix:
        # Pinned versions rather than `macos-latest`, so an image rotation
        # can't silently change what a released binary was built against.
        # The cost is that a retired label stops being served rather than
        # failing: v0.1.0's macos-13 job sat queued with no runner assigned
        # and no error, and since `publish-github` waits for all four, the release
        # never appeared. If a build job never starts, check the label here
        # against actions/runner-images before looking anywhere else.
        include:
          # Built on the arm64 runner, not macos-15-intel: Apple's toolchain
          # targets x86_64 from Apple Silicon out of the box (cc-rs passes
          # `-arch x86_64`, and the SDK carries both), and the Intel runner
          # was the slowest leg every release, the one `publish-github` waited on.
          # "Built for the right architecture" below checks the result.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # windows-11-arm is GA per actions/runner-images, not a preview
          # label — confirmed 2026-09-23. Client OS rather than Server, the
          # same way the macOS runners above are, and that is fine for a
          # native build+test job.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Not .github/actions/rust-setup (ci.yml's `test-linux`/`test-windows` jobs):
      # that composite bakes in rustfmt+clippy components and
      # Swatinem/rust-cache, and this job wants neither: a cross-compile
      # target instead of components, and no cache at all.
      #
      # No rust-cache, here or in any other job in this workflow, and not by
      # oversight: a release can never read one. GitHub scopes a cache to
      # the ref that saved it, and a run restores only from its own ref and
      # the default branch. Every release runs on a tag no run has used
      # before (refs/tags/v0.4.11 cannot see what refs/tags/v0.4.10 saved),
      # and `main` never builds these targets in the release profile: ci.yml
      # builds the dev and test profiles, for Linux and Windows. The one run
      # that could restore an entry is a re-run on the same tag, and the
      # usual re-run is of the failed jobs only, which saved nothing:
      # rust-cache does not save from a job that failed. v0.4.10's run
      # (36539755030) showed it: all nine restores said "No cache found",
      # every job compiled from scratch, and each then spent 4 to 23
      # seconds uploading 180 to 535 MB that nothing would read, 2.2 GB a
      # release counted against the repository's cache quota, where it can
      # push out the entries `main` saves for CI, which are read.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.target }}

      # Every target but one builds on a native runner. rusqlite's `bundled`
      # feature compiles the SQLite amalgamation from C, so a cross build
      # needs a C toolchain for the target, and native runners (including the
      # arm64 Linux one) avoid that entirely. The exception is
      # x86_64-apple-darwin, built on the arm64 macOS runner, whose Xcode
      # toolchain already compiles for both Mac architectures.
      # What `recall version` prints beside the version number. Read back
      # from the checkout rather than from `github.sha`, which is the commit
      # the run was *triggered* on: for a tag push the two agree, but for a
      # workflow_dispatch rebuild of an existing tag `github.sha` is the
      # dispatching branch, and the binary would name a commit it was not
      # built from. A stamp that can be wrong is worse than no stamp.
      - name: Record the commit that was checked out
        shell: bash
        run: |
          echo "RECALL_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # What GET /.well-known/recall and the User-Agent report: this is
          # a release build, made now. Without it a build from a checkout
          # calls itself a -dev pre-release of the next patch.
          echo "RECALL_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p recall

      # A cross build that silently produced the host's architecture would
      # ship an arm64 binary as recall-x86_64-apple-darwin. lipo reads the Mach-O
      # header, so this fails before anything is packaged.
      - name: Built for the right architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # An if, not `$(case ... ;; esac)`: the bash 3.2 that macOS
          # runners ship cannot parse a case's `)` inside `$( )`, which is
          # what stopped v0.4.3 at this step before anything was published.
          if [[ "$TARGET" == x86_64-* ]]; then want=x86_64; else want=arm64; fi
          got=$(lipo -archs "target/$TARGET/release/recall")
          echo "$TARGET: $got"
          [ "$got" = "$want" ] || { echo "::error::expected $want, the binary is $got"; exit 1; }

      # From 0.4.6 every archive is named for its Rust target and holds one
      # directory of the same name, with the binary under its own name plus
      # LICENSE and README.md inside: recall-x86_64-apple-darwin.tar.gz holds
      # recall-x86_64-apple-darwin/recall. install.sh, install.ps1,
      # npm/install.js, deploy/fetch-release.sh, the Homebrew formula and
      # cargo-binstall's default templates all expect exactly that.
      # scripts/package-release.py is the one place both the name and the
      # layout are made; this passes it only the binary and the target.
      #
      # CI's `test-installers` job runs this workflow's own `Package*` steps
      # (their `run:` text, read from this file, with each matrix entry's
      # values filled in) against fake binaries, and installs from what they
      # write. So a step here that names or packs an archive differently
      # from what the installers expect fails a pull request, not a release.
      # Keep those steps `shell: bash`; that job runs them with bash. v0.4.5
      # and older were packed differently and keep their archives; see
      # docs/reference/releasing.md.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-release.py "target/${{ matrix.target }}/release/recall" \
            "${{ matrix.target }}" dist

      # A zip rather than a tar.gz because that is what Windows users
      # actually have a double-click extractor for; install.ps1 and
      # npm/install.js both extract it with `tar`, which has shipped as
      # bsdtar (libarchive, zip-capable) on Windows since Windows 10. The
      # same script as Package (Unix), so both write the same layout; the
      # Windows runners call Python `python` (a `python3` there may be the
      # Microsoft Store's placeholder).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package-release.py "target/${{ matrix.target }}/release/recall.exe" \
            "${{ matrix.target }}" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # The server, since 0.4.0 a binary of its own, and the merge worker that
  # runs beside it. Linux only, because that is where servers run, and
  # static against musl, so each file runs in the Alpine image
  # deploy/Dockerfile assembles and on any other Linux too. The client's
  # archives above contain neither.
  build-server:
    name: build-server (${{ matrix.target }})
    needs: check-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No Swatinem/rust-cache, for the reason build-client gives: this runs
      # on a new tag every release, so a cache could only ever miss.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.target }}

      # rusqlite compiles SQLite's C source, so a musl build needs a C
      # compiler that targets musl. Native runners again, so musl-gcc is
      # that compiler for both architectures; naming it avoids the cc
      # crate guessing a cross-compiler name that does not exist here.
      - name: musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          t=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CC_$t=musl-gcc" >> "$GITHUB_ENV"

      - name: Record the commit that was checked out
        run: |
          echo "RECALL_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # One package at a time rather than both in one command: built
      # together, cargo would unify their features, and recall-server would
      # be compiled against the worker's HTTP client, which it must not
      # carry.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p recall-server
          cargo build --release --locked --target ${{ matrix.target }} -p recall-worker

      # A static binary is the promise the images rely on; a dynamic one
      # would build here and fail to start in Alpine.
      #
      # So is passkey sign-in on /admin: a server built without the
      # `passkeys` feature starts and syncs like any other, and only the
      # admin page would show it is missing. `version` names the features
      # built in, and the release refuses one that does not name it.
      #
      # Asked of the ELF headers, not of `file`'s wording: `file` says
      # "static-pie linked" for the amd64 build and "statically linked" for
      # the arm64 one, and matching only the first is what failed v0.4.0's
      # first run. A dynamic binary has a program interpreter and names the
      # libraries it needs; a static one, PIE or not, has neither.
      - name: Package
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/recall-server"
          if ! "$bin" version | grep -Eq '^features:( [a-z-]+)* passkeys( |$)'; then
            echo "::error::$bin was built without passkey sign-in (the passkeys feature)"
            exit 1
          fi
          # recall-server-x86_64-unknown-linux-musl.tar.gz holding
          # recall-server-x86_64-unknown-linux-musl/recall-server, and the
          # same for recall-worker: the layout the client archives above
          # have, from the same script. deploy/fetch-release.sh reads it, and
          # CI's `test-installers` runs this step as written (with stand-ins
          # for the binaries, `file` and `readelf`) to prove it does.
          for name in recall-server recall-worker; do
            bin="target/${{ matrix.target }}/release/$name"
            file "$bin"
            if readelf -lW "$bin" | grep -q 'INTERP' || readelf -dW "$bin" | grep -q '(NEEDED)'; then
              echo "::error::$bin is dynamically linked; the image needs a static one"
              exit 1
            fi
            "$bin" version
            python3 scripts/package-release.py "$bin" "${{ matrix.target }}" dist
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-server-and-worker_linux_${{ matrix.arch }}
          path: dist/*.tar.gz

  publish-github:
    name: publish-github
    needs: [build-client, build-server]
    runs-on: ubuntu-latest
    # The one job here that writes anything: softprops/action-gh-release
    # below needs contents: write to create the Release and upload its
    # assets. Every other job in this workflow only reads the checkout.
    permissions:
      contents: write
    steps:
      # The build jobs' archives only, by name: the image jobs' digests and
      # the Homebrew job's formula are artifacts of this run too, and a
      # re-run of this job must not attach them to the Release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: recall-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # The images a server runs, published so a deploy pulls them instead of
  # building them on the machine serving traffic: ghcr.io/pimlabs/
  # recall-server:<version> and recall-worker:<version>, one tag each
  # covering linux/amd64 and linux/arm64. Built from the release's own
  # binaries, downloaded from the GitHub Release above and checked against
  # its checksums.txt, exactly as `docker compose up -d --build` on a server
  # built them for itself up to 0.4.6: the same Dockerfile, targets and
  # build arguments. A deploy only ever names a version tag, never `latest`:
  # a tag that moves by itself would be a deploy nobody asked for. `latest`
  # is moved too, afterwards (`tag-latest`), for pulling by hand only.
  # scripts/release-image.sh does every part; ci.yml's
  # `check-publish-image` runs its build on every pull request.
  #
  # Three jobs, Docker's pattern for a build spread across runners:
  #
  #   check-image    is each tag already published? A re-run of a published
  #                  version builds nothing, and a registry that cannot say
  #                  stops the run rather than risk moving a tag.
  #   build-image    one leg per architecture, each on a runner of that
  #                  architecture, pushing by digest with no tag. Never
  #                  under emulation: under QEMU the arm64 half's npm install
  #                  of the claude CLI died with an illegal instruction and
  #                  the build hung until it was cancelled.
  #   publish-image  joins the two digests into the version's tag, attests
  #                  it, and checks a server can pull it with no credentials.
  #
  # None is behind a release-* environment, deliberately. The image holds
  # nothing that is not already public and unapproved in the GitHub Release,
  # a package version can be deleted (npm and crates.io cannot be undone),
  # and `deploy` below needs it: gating it would make every deploy wait for
  # the approval that deploys were deliberately kept out of. GITHUB_TOKEN is
  # the only credential. A package it creates is private whatever this
  # repository's visibility, and GitHub has no API to change that, so
  # `publish-image` fails, before `deploy`, until the owner has made each
  # package public once; see docs/reference/releasing.md.
  #
  # A tag from before images were published (a run dispatched by hand for
  # 0.4.6 or older) has no scripts/release-image.sh, and is deployed by
  # building on the server (deploy.yml's LAST_BUILT_ON_SERVER), so all three
  # pass without doing anything.
  check-image:
    name: check-image
    needs: [check-versions, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read, to see a package that is still private.
      packages: read
    env:
      VERSION: ${{ needs.check-versions.outputs.version }}
    outputs:
      build: ${{ steps.status.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is each image already published?
        id: status
        run: |
          if [ ! -f scripts/release-image.sh ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION predates published images: it is deployed by building on the server, so nothing is published here."
            exit 0
          fi
          scripts/release-image.sh status "$VERSION"

  build-image:
    name: build-image (${{ matrix.arch }})
    needs: [check-versions, check-image]
    if: needs.check-image.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check-versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Its own timeout, well inside the job's: a build that stops making
      # progress fails in minutes, rather than holding the runner until the
      # job is cancelled.
      - name: Build, push by digest, and run it here
        timeout-minutes: 20
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/release-image.sh build "$VERSION" "$(git rev-parse --short HEAD)" "$ARCH" push "$RUNNER_TEMP/digests"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: publish-image
    needs: [check-versions, check-image, build-image]
    # After check-image, whether build-image ran (something to publish) or
    # was skipped (nothing to build); never after either failed.
    if: >-
      !cancelled() && needs.check-image.result == 'success'
      && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run per version at a time, and one that has started finishes: two
    # at once could both find the tag unpublished and both make it.
    concurrency:
      group: publish-image-${{ needs.check-versions.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # The provenance attestations: a Sigstore certificate from the job's
      # OIDC identity, and the attestation stored against this repository.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check-versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Does this tag publish images?
        id: scope
        run: |
          if [ -f scripts/release-image.sh ]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION predates published images: it is deployed by building on the server."
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build-image.result == 'success'
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.skipped == 'false'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.scope.outputs.skipped == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the version, from both architectures
        id: push
        if: steps.scope.outputs.skipped == 'false'
        run: scripts/release-image.sh manifest "$VERSION" "$RUNNER_TEMP/digests"

      # SLSA provenance signed for this workflow run, stored beside each
      # image in GHCR: `gh attestation verify oci://ghcr.io/pimlabs/
      # recall-server:<version> --repo pimlabs/recall`. buildx attaches its
      # own provenance to each architecture's image too (--provenance
      # mode=max). A tag an earlier run made is attested again, so a run
      # whose attestation failed after its tag was made is finished by
      # re-running it. deploy.yml verifies it, by digest and with this
      # workflow as the signer, before a server pulls anything, so an
      # image without one is never deployed.
      - name: Attest the server image
        if: steps.push.outputs.server_digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pimlabs/recall-server
          subject-digest: ${{ steps.push.outputs.server_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the worker image
        if: steps.push.outputs.worker_digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pimlabs/recall-worker
          subject-digest: ${{ steps.push.outputs.worker_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Can a server pull them without credentials?
        if: steps.scope.outputs.skipped == 'false'
        run: |
          failed=""
          for name in recall-server recall-worker; do
            scripts/image-pullable.sh "ghcr.io/pimlabs/$name:$VERSION" || failed="$failed $name"
          done
          if [ -n "$failed" ]; then
            for name in $failed; do
              echo "::error::ghcr.io/pimlabs/$name:$VERSION is published, but a server cannot pull it without credentials. Make the package public once: https://github.com/orgs/pimlabs/packages/container/$name/settings (Danger Zone, Change visibility, Public). Then re-run the failed jobs; nothing already published is rebuilt, and the deploy follows."
            done
            exit 1
          fi

  # `latest` for each image, moved to this version when it is the newest
  # release, never back to an older one (scripts/release-image.sh's
  # `latest`). For someone pulling by hand; a deploy names a version. Its
  # own job, which `deploy` does not wait on: a registry that cannot move
  # `latest` must not hold up the server running the release.
  tag-latest:
    name: tag-latest
    needs: [check-versions, publish-image]
    if: >-
      !cancelled() && needs.publish-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time across versions: two releases at once must not each
    # read `latest` before the other moves it.
    concurrency:
      group: tag-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check-versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Does this tag move latest?
        id: scope
        run: |
          if [ -f scripts/release-image.sh ] && grep -q '^  latest)' scripts/release-image.sh; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION predates the latest tag, so latest was not moved."
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.skipped == 'false'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.scope.outputs.skipped == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to this version, if it is the newest
        if: steps.scope.outputs.skipped == 'false'
        run: scripts/release-image.sh latest "$VERSION"

  # The server runs the release that was just published: it pulls the
  # images `publish-image` pushed, which hold the recall-server above,
  # checked against checksums.txt. Not behind a release-* environment: a
  # deploy can be undone by deploying the previous version (Actions → Deploy
  # a release), which a registry publish cannot. Skips, and says so, where
  # no server is configured.
  #
  # Its `if` is spelled out because publish-image runs after build-image was
  # skipped, and a job's default `success()` counts that skip against it.
  #
  # Its permissions are the most deploy.yml can have when called from here:
  # attestations: read, for the deploy to verify the attestation
  # `publish-image` made before the server pulls anything.
  deploy:
    needs: [check-versions, publish-image]
    if: >-
      !cancelled() && needs.check-versions.result == 'success'
      && needs.publish-image.result == 'success'
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.check-versions.outputs.version }}
    secrets: inherit

  # Where the release goes from here, on the run's summary page: the
  # registries are a separate workflow, run when a person decides.
  next:
    name: next
    needs: [check-versions, publish-github]
    runs-on: ubuntu-latest
    steps:
      - name: Say how to publish
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          {
            echo "### $TAG is built"
            echo ""
            echo "The GitHub Release exists, so install.sh and install.ps1 already install it."
            echo "npm, crates.io and the Homebrew tap wait for **Publish a release**: Actions >"
            echo "Publish a release > Run workflow, *Use workflow from* \`$TAG\`, then approve"
            echo "its release-* environments in one Review deployments."
          } >> "$GITHUB_STEP_SUMMARY"
