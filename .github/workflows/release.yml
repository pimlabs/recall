name: Release

# Tagged releases exist for one reason: npm, Homebrew and install.sh all
# need a fixed artifact to point at.
#
# The registries are published from here too, and without a stored token for
# either of them: npm and crates.io both trust this workflow's OIDC identity
# directly ("trusted publishing"), and hand it a credential that lives for
# the length of the job. The jobs that publish sit behind the `release`
# environment, whose required reviewer is the owner — so a pushed tag builds
# and drafts everything, and nothing reaches a registry until a person
# approves it. Publishing cannot be undone (npm: no unpublish after 72h;
# crates.io: yank, never delete), which is why that gate is a person and not
# a check. Setup is in docs/reference/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  # Before the native builds, not after: npm's postinstall downloads the
  # release named after the package's *own* version, so a tag that disagrees
  # with npm/package.json ships a package that installs nothing — and it would
  # otherwise be discovered after twenty minutes of runner time.
  check-versions:
    name: check-versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.agree.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: The tag, Cargo.toml and npm/package.json agree
        id: agree
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          npm_v=$(grep -m1 '"version"' npm/package.json | cut -d'"' -f4)
          echo "tag $want | Cargo.toml $cargo_v | npm $npm_v"
          [ "$cargo_v" = "$want" ] || { echo "::error::Cargo.toml says $cargo_v, the tag says $want"; exit 1; }
          [ "$npm_v" = "$want" ]   || { echo "::error::npm/package.json says $npm_v, the tag says $want"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"

  build-client:
    name: build-client (${{ matrix.target }})
    needs: check-versions
    strategy:
      fail-fast: false
      matrix:
        # Pinned versions rather than `macos-latest`, so an image rotation
        # can't silently change what a released binary was built against.
        # The cost is that a retired label stops being served rather than
        # failing: v0.1.0's macos-13 job sat queued with no runner assigned
        # and no error, and since `publish-github` waits for all four, the release
        # never appeared. If a build job never starts, check the label here
        # against actions/runner-images before looking anywhere else.
        include:
          # Built on the arm64 runner, not macos-15-intel: Apple's toolchain
          # targets x86_64 from Apple Silicon out of the box (cc-rs passes
          # `-arch x86_64`, and the SDK carries both), and the Intel runner
          # was the slowest leg every release, the one `publish-github` waited on.
          # "Built for the right architecture" below checks the result.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # windows-11-arm is GA per actions/runner-images, not a preview
          # label — confirmed 2026-09-23. Client OS rather than Server, the
          # same way the macOS runners above are, and that is fine for a
          # native build+test job.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Not .github/actions/rust-setup (ci.yml's `test-linux`/`test-windows` jobs):
      # that composite bakes in rustfmt+clippy components and a main-only
      # save-if, and this job needs neither, wanting a cross-compile target
      # instead of components, and a cache that always saves, since a
      # release only runs from a tag or a manual dispatch, never a PR
      # restore-only run that main-only saving exists to protect. Reusing
      # it here would mean overriding most of what it fixes, so the two
      # rust-cache steps stay written out plainly instead of threading
      # exceptions through a composite built for a different shape.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # Every target but one builds on a native runner. rusqlite's `bundled`
      # feature compiles the SQLite amalgamation from C, so a cross build
      # needs a C toolchain for the target, and native runners (including the
      # arm64 Linux one) avoid that entirely. The exception is
      # x86_64-apple-darwin, built on the arm64 macOS runner, whose Xcode
      # toolchain already compiles for both Mac architectures.
      # What `recall version` prints beside the version number. Read back
      # from the checkout rather than from `github.sha`, which is the commit
      # the run was *triggered* on: for a tag push the two agree, but for a
      # workflow_dispatch rebuild of an existing tag `github.sha` is the
      # dispatching branch, and the binary would name a commit it was not
      # built from. A stamp that can be wrong is worse than no stamp.
      - name: Record the commit that was checked out
        shell: bash
        run: |
          echo "RECALL_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # What GET /.well-known/recall and the User-Agent report: this is
          # a release build, made now. Without it a build from a checkout
          # calls itself a -dev pre-release of the next patch.
          echo "RECALL_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p recall

      # A cross build that silently produced the host's architecture would
      # ship an arm64 binary as recall-x86_64-apple-darwin. lipo reads the Mach-O
      # header, so this fails before anything is packaged.
      - name: Built for the right architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # An if, not `$(case ... ;; esac)`: the bash 3.2 that macOS
          # runners ship cannot parse a case's `)` inside `$( )`, which is
          # what stopped v0.4.3 at this step before anything was published.
          if [[ "$TARGET" == x86_64-* ]]; then want=x86_64; else want=arm64; fi
          got=$(lipo -archs "target/$TARGET/release/recall")
          echo "$TARGET: $got"
          [ "$got" = "$want" ] || { echo "::error::expected $want, the binary is $got"; exit 1; }

      # From 0.4.6 every archive is named for its Rust target and holds one
      # directory of the same name, with the binary under its own name plus
      # LICENSE and README.md inside: recall-x86_64-apple-darwin.tar.gz holds
      # recall-x86_64-apple-darwin/recall. install.sh, install.ps1,
      # npm/install.js, deploy/fetch-release.sh, the Homebrew formula and
      # cargo-binstall's default templates all expect exactly that.
      # scripts/package-release.py is the one place both the name and the
      # layout are made; this passes it only the binary and the target.
      #
      # CI's `test-installers` job runs this workflow's own `Package*` steps
      # (their `run:` text, read from this file, with each matrix entry's
      # values filled in) against fake binaries, and installs from what they
      # write. So a step here that names or packs an archive differently
      # from what the installers expect fails a pull request, not a release.
      # Keep those steps `shell: bash`; that job runs them with bash. v0.4.5
      # and older were packed differently and keep their archives; see
      # docs/reference/releasing.md.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-release.py "target/${{ matrix.target }}/release/recall" \
            "${{ matrix.target }}" dist

      # A zip rather than a tar.gz because that is what Windows users
      # actually have a double-click extractor for; install.ps1 and
      # npm/install.js both extract it with `tar`, which has shipped as
      # bsdtar (libarchive, zip-capable) on Windows since Windows 10. The
      # same script as Package (Unix), so both write the same layout; the
      # Windows runners call Python `python` (a `python3` there may be the
      # Microsoft Store's placeholder).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package-release.py "target/${{ matrix.target }}/release/recall.exe" \
            "${{ matrix.target }}" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # The server, since 0.4.0 a binary of its own, and the merge worker that
  # runs beside it. Linux only, because that is where servers run, and
  # static against musl, so each file runs in the Alpine image
  # deploy/Dockerfile assembles and on any other Linux too. The client's
  # archives above contain neither.
  build-server:
    name: build-server (${{ matrix.target }})
    needs: check-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # rusqlite compiles SQLite's C source, so a musl build needs a C
      # compiler that targets musl. Native runners again, so musl-gcc is
      # that compiler for both architectures; naming it avoids the cc
      # crate guessing a cross-compiler name that does not exist here.
      - name: musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          t=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CC_$t=musl-gcc" >> "$GITHUB_ENV"

      - name: Record the commit that was checked out
        run: |
          echo "RECALL_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # One package at a time rather than both in one command: built
      # together, cargo would unify their features, and recall-server would
      # be compiled against the worker's HTTP client, which it must not
      # carry.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p recall-server
          cargo build --release --locked --target ${{ matrix.target }} -p recall-worker

      # A static binary is the promise the images rely on; a dynamic one
      # would build here and fail to start in Alpine.
      #
      # So is passkey sign-in on /admin: a server built without the
      # `passkeys` feature starts and syncs like any other, and only the
      # admin page would show it is missing. `version` names the features
      # built in, and the release refuses one that does not name it.
      #
      # Asked of the ELF headers, not of `file`'s wording: `file` says
      # "static-pie linked" for the amd64 build and "statically linked" for
      # the arm64 one, and matching only the first is what failed v0.4.0's
      # first run. A dynamic binary has a program interpreter and names the
      # libraries it needs; a static one, PIE or not, has neither.
      - name: Package
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/recall-server"
          if ! "$bin" version | grep -Eq '^features:( [a-z-]+)* passkeys( |$)'; then
            echo "::error::$bin was built without passkey sign-in (the passkeys feature)"
            exit 1
          fi
          # recall-server-x86_64-unknown-linux-musl.tar.gz holding
          # recall-server-x86_64-unknown-linux-musl/recall-server, and the
          # same for recall-worker: the layout the client archives above
          # have, from the same script. deploy/fetch-release.sh reads it, and
          # CI's `test-installers` runs this step as written (with stand-ins
          # for the binaries, `file` and `readelf`) to prove it does.
          for name in recall-server recall-worker; do
            bin="target/${{ matrix.target }}/release/$name"
            file "$bin"
            if readelf -lW "$bin" | grep -q 'INTERP' || readelf -dW "$bin" | grep -q '(NEEDED)'; then
              echo "::error::$bin is dynamically linked; the image needs a static one"
              exit 1
            fi
            "$bin" version
            python3 scripts/package-release.py "$bin" "${{ matrix.target }}" dist
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-server-and-worker_linux_${{ matrix.arch }}
          path: dist/*.tar.gz

  publish-github:
    name: publish-github
    needs: [build-client, build-server]
    runs-on: ubuntu-latest
    # The one job here that writes anything: softprops/action-gh-release
    # below needs contents: write to create the Release and upload its
    # assets. Every other job in this workflow only reads the checkout.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # The images a server runs, published so a deploy pulls them instead of
  # building them on the machine serving traffic: ghcr.io/pimlabs/
  # recall-server:<version> and recall-worker:<version>, for linux/amd64 and
  # linux/arm64. Built from the release's own binaries, downloaded from the
  # GitHub Release above and checked against its checksums.txt, exactly as
  # `docker compose up -d --build` on a server built them for itself up to
  # 0.4.6: the same Dockerfile, target and build arguments
  # (scripts/release-image.sh, which ci.yml's `check-publish-image` runs on
  # every pull request with push=false). Only a version tag, never `latest`:
  # a deploy names the version it wants, and a tag that moves by itself is
  # a deploy nobody asked for.
  #
  # Not behind the `release` environment, deliberately. The image holds
  # nothing that is not already public and unapproved in the GitHub Release,
  # a package version can be deleted (npm and crates.io cannot be undone),
  # and `deploy` below needs it: gating it would make every deploy wait for
  # the approval that deploys were deliberately kept out of.
  #
  # The only job with `packages: write`, and GITHUB_TOKEN is its only
  # credential. A package it creates is private whatever this repository's
  # visibility, and GitHub has no API to change that, so the last step asks
  # GHCR the way a server will, with no credentials, and fails here, before
  # `deploy`, until the owner has made each package public once; see
  # docs/reference/releasing.md. A version already in the registry is not
  # rebuilt, so re-running this job after that is safe.
  publish-image:
    name: publish-image
    needs: [check-versions, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run per version at a time, and one that has started finishes: two
    # at once could both find a tag unpublished and both push it.
    concurrency:
      group: publish-image-${{ needs.check-versions.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # The provenance attestations: a Sigstore certificate from the job's
      # OIDC identity, and the attestation stored against this repository.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check-versions.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The arm64 half's RUN steps (apk, npm, and `recall-server version` on
      # the downloaded binary) run under emulation on this amd64 runner.
      # Nothing is compiled, so that costs minutes, not an hour.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          # The binfmt image that installs the emulators, pinned like the
          # actions around it rather than the action's default, which is
          # `latest`.
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # qemu-v10.2.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag from before images were published (a run dispatched by hand
      # for 0.4.6 or older) has no script to publish one with, and is
      # deployed by building on the server instead (deploy.yml's
      # LAST_BUILT_ON_SERVER), so there is nothing to do here.
      - name: Build and push
        id: push
        run: |
          if [ ! -f scripts/release-image.sh ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION predates published images: it is deployed by building on the server, so nothing is published here."
            exit 0
          fi
          scripts/release-image.sh push "$VERSION" "$(git rev-parse --short HEAD)"

      # SLSA provenance signed for this workflow run, stored beside each
      # image in GHCR: `gh attestation verify oci://ghcr.io/pimlabs/
      # recall-server:<version> --repo pimlabs/recall`. buildx attaches its
      # own provenance too (--provenance mode=max). An image an earlier run
      # pushed is attested again, so a run whose attestation failed after
      # its push is finished by re-running it.
      - name: Attest the server image
        if: steps.push.outputs.server_digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pimlabs/recall-server
          subject-digest: ${{ steps.push.outputs.server_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the worker image
        if: steps.push.outputs.worker_digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pimlabs/recall-worker
          subject-digest: ${{ steps.push.outputs.worker_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Can a server pull them without credentials?
        if: steps.push.outputs.skipped != 'true'
        run: |
          failed=""
          for name in recall-server recall-worker; do
            scripts/image-pullable.sh "ghcr.io/pimlabs/$name:$VERSION" || failed="$failed $name"
          done
          if [ -n "$failed" ]; then
            for name in $failed; do
              echo "::error::ghcr.io/pimlabs/$name:$VERSION is published, but a server cannot pull it without credentials. Make the package public once: https://github.com/orgs/pimlabs/packages/container/$name/settings (Danger Zone, Change visibility, Public). Then re-run this job; it will not rebuild what is already there, and the deploy follows it."
            done
            exit 1
          fi

  # ---- The registries. Each waits for the GitHub Release, because npm's
  # postinstall and the Homebrew formula both download its archives, and each
  # waits for the `release` environment's approval. They are separate jobs
  # because they have nothing to do with each other: a failure in one must
  # not stop the others, which is what left v0.2.0 with four crates
  # unpublished. Each skips a version its registry already has, so re-running
  # a failed job is always safe.

  publish-npm:
    name: publish-npm
    needs: publish-github
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # No `registry-url`: that writes an .npmrc expecting NODE_AUTH_TOKEN,
      # and there is deliberately no token to give it. npm finds the OIDC
      # credential on its own.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later; do not rely on
      # whichever npm the runner's Node happens to ship.
      - run: npm install -g npm@latest
      - name: npm publish
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          if curl -sf "https://registry.npmjs.org/@pimlabs%2Frecall/$v" >/dev/null; then
            echo "npm already has $v — nothing to do"
            exit 0
          fi
          cd npm
          # Scoped packages default to private. Provenance is attached
          # automatically under trusted publishing.
          npm publish --access public

  publish-crates:
    name: publish-crates
    needs: publish-github
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Exchanges this job's OIDC token for a crates.io token that lasts 30
      # minutes and is revoked when the job ends.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: cargo publish, bottom-up
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          v="${TAG#v}"
          # Bottom-up: each crate must be on the index before anything that
          # depends on it can be packaged. Same order as scripts/release.sh.
          # recall-worker before recall-server, which uses its merge code.
          crates=(recall-wire recall-hooks recall-worker recall-server recall)
          for i in "${!crates[@]}"; do
            n="${crates[$i]}"
            if curl -sf "https://index.crates.io/${n:0:2}/${n:2:2}/$n" | grep -q "\"vers\":\"$v\""; then
              echo "$n already at $v"
              continue
            fi
            echo "::group::cargo publish -p $n"
            cargo publish -p "$n"
            echo "::endgroup::"
            # The index needs a moment, or the next crate fails with
            # "no matching package named ...".
            [ "$i" -eq $(( ${#crates[@]} - 1 )) ] || sleep 20
          done

  publish-homebrew:
    name: publish-homebrew
    needs: publish-github
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # The one credential this workflow stores: a fine-grained token that
      # can write to pimlabs/homebrew-tap and nothing else. It lives on the
      # `release` environment, so it is only readable by a job that has
      # already been approved. Missing is reported, not failed — the laptop
      # path can still push the tap.
      - name: Is the tap token configured?
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN is not set on the release environment, so the tap was not updated. See docs/reference/releasing.md."
          fi
      - name: Rewrite the formula from this release's checksums
        if: steps.token.outputs.configured == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL "https://github.com/$REPO/releases/download/$TAG/checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          python3 scripts/update-formula.py "${TAG#v}" "$RUNNER_TEMP/checksums.txt"
          git --no-pager diff --stat Formula/recall.rb
      - name: Push it to the tap
        if: steps.token.outputs.configured == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/push-tap.sh "${TAG#v}" "https://x-access-token:${TAP_TOKEN}@github.com/pimlabs/homebrew-tap.git"
      # This repository's copy of the formula is the source the tap is
      # generated from, so it has to follow — but a job that can push to
      # main is a larger grant than this one needs. The rewritten file is
      # kept as an artifact, and the step summary says a PR is owed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.token.outputs.configured == 'true'
        with:
          name: formula
          path: Formula/recall.rb
      - name: Say what is left
        if: steps.token.outputs.configured == 'true'
        run: |
          {
            echo "### Homebrew tap updated"
            echo ""
            echo "\`Formula/recall.rb\` in this repository still has the previous release's"
            echo "checksums. The rewritten file is attached to this run as the \`formula\`"
            echo "artifact; it lands on \`main\` through a pull request like every other change."
          } >> "$GITHUB_STEP_SUMMARY"

  # winget, via vedantmgoyal9/winget-releaser (which drives komac under the
  # hood). Unlike the homebrew job above, this does not write to this
  # repository — it opens a pull request against microsoft/winget-pkgs from
  # a fork of it. That fork, and at least one version of the package already
  # present in winget-pkgs, are both one-time setup done by hand; this job
  # cannot create either. See docs/reference/releasing.md.
  publish-winget:
    name: publish-winget
    needs: publish-github
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # The one credential this job stores: a classic PAT with the
      # `public_repo` scope (to open the pull request) and, so a workflow
      # file change upstream in winget-pkgs doesn't fail this job
      # intermittently, `workflow`. It lives on the `release` environment,
      # so it is only readable by a job that has already been approved.
      # Missing is reported, not failed — the first submission and any
      # later one done by hand still work without it.
      - name: Is the winget token configured?
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINGET_TOKEN is not set on the release environment, so winget-pkgs was not updated. See docs/reference/releasing.md."
          fi
      # The default installers-regex only matches .exe/.msi/.msix/.appx —
      # release.yml's Windows archives are .zip (see the `build-client` job's
      # "Package (Windows)" step), so it has to be widened or the action
      # finds no installers to publish at all.
      - name: Publish to winget-pkgs
        if: steps.token.outputs.configured == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: PimLabs.Recall
          installers-regex: '\.zip$'
          release-tag: ${{ github.event.inputs.tag || github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

  # The server runs the release that was just published: it pulls the
  # images `publish-image` pushed, which hold the recall-server above,
  # checked against checksums.txt. Not behind the `release` environment: a
  # deploy can be undone by deploying the previous version (Actions → Deploy
  # a release), which a registry publish cannot. Skips, and says so, where
  # no server is configured.
  deploy:
    needs: [check-versions, publish-image]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.check-versions.outputs.version }}
    secrets: inherit
