name: Release

# Tagged releases exist for one reason: npm, Homebrew and install.sh all
# need a fixed artifact to point at.
#
# The registries are published from here too, and without a stored token for
# either of them: npm and crates.io both trust this workflow's OIDC identity
# directly ("trusted publishing"), and hand it a credential that lives for
# the length of the job. The jobs that publish sit behind the `release`
# environment, whose required reviewer is the owner — so a pushed tag builds
# and drafts everything, and nothing reaches a registry until a person
# approves it. Publishing cannot be undone (npm: no unpublish after 72h;
# crates.io: yank, never delete), which is why that gate is a person and not
# a check. Setup is in docs/reference/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  # Before the native builds, not after: npm's postinstall downloads the
  # release named after the package's *own* version, so a tag that disagrees
  # with npm/package.json ships a package that installs nothing — and it would
  # otherwise be discovered after twenty minutes of runner time.
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.agree.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: The tag, Cargo.toml and npm/package.json agree
        id: agree
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          npm_v=$(grep -m1 '"version"' npm/package.json | cut -d'"' -f4)
          echo "tag $want | Cargo.toml $cargo_v | npm $npm_v"
          [ "$cargo_v" = "$want" ] || { echo "::error::Cargo.toml says $cargo_v, the tag says $want"; exit 1; }
          [ "$npm_v" = "$want" ]   || { echo "::error::npm/package.json says $npm_v, the tag says $want"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        # Pinned versions rather than `macos-latest`, so an image rotation
        # can't silently change what a released binary was built against.
        # The cost is that a retired label stops being served rather than
        # failing: v0.1.0's macos-13 job sat queued with no runner assigned
        # and no error, and since `publish` waits for all four, the release
        # never appeared. If a build job never starts, check the label here
        # against actions/runner-images before looking anywhere else.
        include:
          # Built on the arm64 runner, not macos-15-intel: Apple's toolchain
          # targets x86_64 from Apple Silicon out of the box (cc-rs passes
          # `-arch x86_64`, and the SDK carries both), and the Intel runner
          # was the slowest leg every release, the one `publish` waited on.
          # "Built for the right architecture" below checks the result.
          - target: x86_64-apple-darwin
            os: macos-15
            asset: recall_darwin_amd64
          - target: aarch64-apple-darwin
            os: macos-15
            asset: recall_darwin_arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: recall_linux_amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: recall_linux_arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: recall_windows_amd64
          # windows-11-arm is GA per actions/runner-images, not a preview
          # label — confirmed 2026-09-23. Client OS rather than Server, the
          # same way the macOS runners above are, and that is fine for a
          # native build+test job.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            asset: recall_windows_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Not .github/actions/rust-setup (ci.yml's `rust`/`windows` jobs):
      # that composite bakes in rustfmt+clippy components and a main-only
      # save-if, and this job needs neither, wanting a cross-compile target
      # instead of components, and a cache that always saves, since a
      # release only runs from a tag or a manual dispatch, never a PR
      # restore-only run that main-only saving exists to protect. Reusing
      # it here would mean overriding most of what it fixes, so the two
      # rust-cache steps stay written out plainly instead of threading
      # exceptions through a composite built for a different shape.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Every target but one builds on a native runner. rusqlite's `bundled`
      # feature compiles the SQLite amalgamation from C, so a cross build
      # needs a C toolchain for the target, and native runners (including the
      # arm64 Linux one) avoid that entirely. The exception is
      # x86_64-apple-darwin, built on the arm64 macOS runner, whose Xcode
      # toolchain already compiles for both Mac architectures.
      # What `recall version` prints beside the version number. Read back
      # from the checkout rather than from `github.sha`, which is the commit
      # the run was *triggered* on: for a tag push the two agree, but for a
      # workflow_dispatch rebuild of an existing tag `github.sha` is the
      # dispatching branch, and the binary would name a commit it was not
      # built from. A stamp that can be wrong is worse than no stamp.
      - name: Record the commit that was checked out
        shell: bash
        run: |
          echo "RECALL_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # What GET /.well-known/recall and the User-Agent report: this is
          # a release build, made now. Without it a build from a checkout
          # calls itself a -dev pre-release of the next patch.
          echo "RECALL_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p recall

      # A cross build that silently produced the host's architecture would
      # ship an arm64 binary as recall_darwin_amd64. lipo reads the Mach-O
      # header, so this fails before anything is packaged.
      - name: Built for the right architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          want=$(case "${{ matrix.target }}" in x86_64-*) echo x86_64 ;; aarch64-*) echo arm64 ;; esac)
          got=$(lipo -archs "target/${{ matrix.target }}/release/recall")
          echo "${{ matrix.target }}: $got"
          [ "$got" = "$want" ] || { echo "::error::expected $want, the binary is $got"; exit 1; }

      # Unix packaging: a tar.gz containing the binary renamed to the asset
      # name, which install.sh and npm's installer both expect to find inside
      # once extracted.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/recall" "dist/${{ matrix.asset }}"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"
          rm "dist/${{ matrix.asset }}"

      # Windows packaging: a zip containing the bare `recall.exe` — not
      # renamed, unlike the Unix archives above — which install.ps1 and
      # npm's installer both expect. A zip rather than a tar.gz because
      # that is what Windows users actually have a double-click extractor
      # for; install.ps1 and npm/install.js both extract it with `tar`,
      # which has shipped as bsdtar (libarchive, zip-capable) on Windows
      # since Windows 10, so this needs nothing beyond what Package (Unix)
      # already assumes exists on the machine doing the extracting.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/recall.exe" "dist/recall.exe"
          Compress-Archive -Path "dist/recall.exe" -DestinationPath "dist/${{ matrix.asset }}.zip"
          Remove-Item "dist/recall.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # The server, since 0.4.0 a binary of its own, and the merge worker that
  # runs beside it. Linux only, because that is where servers run, and
  # static against musl, so each file runs in the Alpine image
  # deploy/Dockerfile assembles and on any other Linux too. The client's
  # archives above contain neither.
  build-server:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite compiles SQLite's C source, so a musl build needs a C
      # compiler that targets musl. Native runners again, so musl-gcc is
      # that compiler for both architectures; naming it avoids the cc
      # crate guessing a cross-compiler name that does not exist here.
      - name: musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          t=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CC_$t=musl-gcc" >> "$GITHUB_ENV"

      - name: Record the commit that was checked out
        run: |
          echo "RECALL_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          echo "RECALL_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # One package at a time rather than both in one command: built
      # together, cargo would unify their features, and recall-server would
      # be compiled against the worker's HTTP client, which it must not
      # carry.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p recall-server
          cargo build --release --locked --target ${{ matrix.target }} -p recall-worker

      # A static binary is the promise the images rely on; a dynamic one
      # would build here and fail to start in Alpine.
      #
      # So is passkey sign-in on /admin: a server built without the
      # `passkeys` feature starts and syncs like any other, and only the
      # admin page would show it is missing. `version` names the features
      # built in, and the release refuses one that does not name it.
      #
      # Asked of the ELF headers, not of `file`'s wording: `file` says
      # "static-pie linked" for the amd64 build and "statically linked" for
      # the arm64 one, and matching only the first is what failed v0.4.0's
      # first run. A dynamic binary has a program interpreter and names the
      # libraries it needs; a static one, PIE or not, has neither.
      - name: Package
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/recall-server"
          if ! "$bin" version | grep -Eq '^features:( [a-z-]+)* passkeys( |$)'; then
            echo "::error::$bin was built without passkey sign-in (the passkeys feature)"
            exit 1
          fi
          mkdir -p dist
          for name in recall-server recall-worker; do
            bin="target/${{ matrix.target }}/release/$name"
            asset="${name}_linux_${{ matrix.arch }}"
            file "$bin"
            if readelf -lW "$bin" | grep -q 'INTERP' || readelf -dW "$bin" | grep -q '(NEEDED)'; then
              echo "::error::$bin is dynamically linked; the image needs a static one"
              exit 1
            fi
            "$bin" version
            cp "$bin" "dist/$asset"
            tar -czf "dist/$asset.tar.gz" -C dist "$asset"
            rm "dist/$asset"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: recall-server-and-worker_linux_${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: [build, build-server]
    runs-on: ubuntu-latest
    # The one job here that writes anything: softprops/action-gh-release
    # below needs contents: write to create the Release and upload its
    # assets. Every other job in this workflow only reads the checkout.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # ---- The registries. Each waits for the GitHub Release, because npm's
  # postinstall and the Homebrew formula both download its archives, and each
  # waits for the `release` environment's approval. They are separate jobs
  # because they have nothing to do with each other: a failure in one must
  # not stop the others, which is what left v0.2.0 with four crates
  # unpublished. Each skips a version its registry already has, so re-running
  # a failed job is always safe.

  npm:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # No `registry-url`: that writes an .npmrc expecting NODE_AUTH_TOKEN,
      # and there is deliberately no token to give it. npm finds the OIDC
      # credential on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later; do not rely on
      # whichever npm the runner's Node happens to ship.
      - run: npm install -g npm@latest
      - name: npm publish
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          if curl -sf "https://registry.npmjs.org/@pimlabs%2Frecall/$v" >/dev/null; then
            echo "npm already has $v — nothing to do"
            exit 0
          fi
          cd npm
          # Scoped packages default to private. Provenance is attached
          # automatically under trusted publishing.
          npm publish --access public

  crates:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exchanges this job's OIDC token for a crates.io token that lasts 30
      # minutes and is revoked when the job ends.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish, bottom-up
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          v="${TAG#v}"
          # Bottom-up: each crate must be on the index before anything that
          # depends on it can be packaged. Same order as scripts/release.sh.
          # recall-worker before recall-server, which uses its merge code.
          crates=(recall-wire recall-hooks recall-worker recall-server recall)
          for i in "${!crates[@]}"; do
            n="${crates[$i]}"
            if curl -sf "https://index.crates.io/${n:0:2}/${n:2:2}/$n" | grep -q "\"vers\":\"$v\""; then
              echo "$n already at $v"
              continue
            fi
            echo "::group::cargo publish -p $n"
            cargo publish -p "$n"
            echo "::endgroup::"
            # The index needs a moment, or the next crate fails with
            # "no matching package named ...".
            [ "$i" -eq $(( ${#crates[@]} - 1 )) ] || sleep 20
          done

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # The one credential this workflow stores: a fine-grained token that
      # can write to pimlabs/homebrew-tap and nothing else. It lives on the
      # `release` environment, so it is only readable by a job that has
      # already been approved. Missing is reported, not failed — the laptop
      # path can still push the tap.
      - name: Is the tap token configured?
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN is not set on the release environment, so the tap was not updated. See docs/reference/releasing.md."
          fi
      - name: Rewrite the formula from this release's checksums
        if: steps.token.outputs.configured == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL "https://github.com/$REPO/releases/download/$TAG/checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          python3 scripts/update-formula.py "${TAG#v}" "$RUNNER_TEMP/checksums.txt"
          git --no-pager diff --stat Formula/recall.rb
      - name: Push it to the tap
        if: steps.token.outputs.configured == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/push-tap.sh "${TAG#v}" "https://x-access-token:${TAP_TOKEN}@github.com/pimlabs/homebrew-tap.git"
      # This repository's copy of the formula is the source the tap is
      # generated from, so it has to follow — but a job that can push to
      # main is a larger grant than this one needs. The rewritten file is
      # kept as an artifact, and the step summary says a PR is owed.
      - uses: actions/upload-artifact@v4
        if: steps.token.outputs.configured == 'true'
        with:
          name: formula
          path: Formula/recall.rb
      - name: Say what is left
        if: steps.token.outputs.configured == 'true'
        run: |
          {
            echo "### Homebrew tap updated"
            echo ""
            echo "\`Formula/recall.rb\` in this repository still has the previous release's"
            echo "checksums. The rewritten file is attached to this run as the \`formula\`"
            echo "artifact; it lands on \`main\` through a pull request like every other change."
          } >> "$GITHUB_STEP_SUMMARY"

  # winget, via vedantmgoyal9/winget-releaser (which drives komac under the
  # hood). Unlike the homebrew job above, this does not write to this
  # repository — it opens a pull request against microsoft/winget-pkgs from
  # a fork of it. That fork, and at least one version of the package already
  # present in winget-pkgs, are both one-time setup done by hand; this job
  # cannot create either. See docs/reference/releasing.md.
  winget:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # The one credential this job stores: a classic PAT with the
      # `public_repo` scope (to open the pull request) and, so a workflow
      # file change upstream in winget-pkgs doesn't fail this job
      # intermittently, `workflow`. It lives on the `release` environment,
      # so it is only readable by a job that has already been approved.
      # Missing is reported, not failed — the first submission and any
      # later one done by hand still work without it.
      - name: Is the winget token configured?
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINGET_TOKEN is not set on the release environment, so winget-pkgs was not updated. See docs/reference/releasing.md."
          fi
      # The default installers-regex only matches .exe/.msi/.msix/.appx —
      # release.yml's Windows archives are .zip (see the `build` job's
      # "Package (Windows)" step), so it has to be widened or the action
      # finds no installers to publish at all.
      - name: Publish to winget-pkgs
        if: steps.token.outputs.configured == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: PimLabs.Recall
          installers-regex: '\.zip$'
          release-tag: ${{ github.event.inputs.tag || github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

  # The server runs the release that was just published: its image holds
  # the recall-server above, checked against checksums.txt. Not behind the
  # `release` environment: a deploy can be undone by deploying the previous
  # version (Actions → Deploy), which a registry publish cannot. Skips, and
  # says so, where no server is configured.
  deploy:
    needs: [versions, publish]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.versions.outputs.version }}
    secrets: inherit
