name: Release

# Tagged releases exist for one reason: npm, Homebrew and install.sh all
# need a fixed artifact to point at. See docs/go-rewrite-design.md —
# ROADMAP Phase 4's argument against versioning held for a server deployed
# straight from main, and stopped holding once binaries get distributed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test before releasing anything
        run: go test ./...

      - name: Build every platform
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="$(git rev-parse --short HEAD)"
          # CGO stays off: the SQLite driver is pure Go, which is what keeps
          # this a plain GOOS/GOARCH matrix with no C toolchain per target.
          for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            out="dist/recall_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${commit}" \
              -o "$out" ./cmd/recall
            tar -czf "${out}.tar.gz" -C dist "$(basename "$out")"
            rm "$out"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
