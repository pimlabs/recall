name: Release

# Tagged releases exist for one reason: npm, Homebrew and install.sh all
# need a fixed artifact to point at.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Pinned versions rather than `macos-latest`, so an image rotation
        # can't silently change what a released binary was built against.
        # The cost is that a retired label stops being served rather than
        # failing: v0.1.0's macos-13 job sat queued with no runner assigned
        # and no error, and since `publish` waits for all four, the release
        # never appeared. If a build job never starts, check the label here
        # against actions/runner-images before looking anywhere else.
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            asset: recall_darwin_amd64
          - target: aarch64-apple-darwin
            os: macos-15
            asset: recall_darwin_arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: recall_linux_amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: recall_linux_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Every target builds on a native runner rather than cross-compiling.
      # rusqlite's `bundled` feature compiles the SQLite amalgamation from C,
      # so a cross build would need a C toolchain per target — native runners
      # (including the arm64 Linux one) avoid that entirely.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p recall-sync
        # What `recall version` prints beside the version number. Without it
        # every released binary says "unknown" — deploy/Dockerfile was the
        # only place setting it, which covers the server image and none of
        # the four archives people actually download.
        env:
          RECALL_GIT_COMMIT: ${{ github.sha }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/recall" "dist/${{ matrix.asset }}"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"
          rm "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
