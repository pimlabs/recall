name: CI

# Deploying is not in here any more. Since 0.4.0 a server runs releases, not
# `main`, so the deploy runs after a release is published: see deploy.yml.
# A push to `main` is checked and nothing else.

on:
  push:
    branches: [main]
  pull_request:

# Pushing again to a pull request makes the run for the commit it replaced
# worthless: nobody is waiting on an answer about a commit that is no longer
# the branch tip. PR #64 took four pushes and ran all four to completion — 198s,
# 216s, 209s, 183s — and only the last one was being read. The minutes matter
# less than the queue: three dead runs sit in front of the live one.
#
# A pull_request run is keyed by its PR number, so the runs on one PR share a
# group and supersede one another. Anything else is keyed by `github.run_id`,
# unique per run, so a push to `main` is alone in its group and always runs
# to the end: `start-release.yml` refuses to tag a commit whose CI run did not
# finish green in every job, and a cancelled run is not green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('uncancellable-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job pushes, tags or uploads anything with GITHUB_TOKEN — each only
# reads the checkout and builds against it — so read is all any needs.
permissions:
  contents: read

# Only ever applies to the dev/test profile — [profile.release] in
# Cargo.toml (what release.yml ships and what the Docker "release" build
# fetches) is untouched by any of these.
#
# CARGO_INCREMENTAL=0: incremental compilation earns its keep by reusing
# per-function state from the target dir a *previous build of the same
# checkout* left behind, which is exactly what Swatinem/rust-cache below
# does not restore — its cache deliberately excludes target/**/incremental,
# since that state is fragile across machines and was never worth the
# storage. With nothing to reuse, CARGO_INCREMENTAL=1 (cargo's default) pays
# the bookkeeping and the extra object-file splitting for a rebuild every
# run does anyway. Off, cargo just does a normal build against the cache's
# .rlibs, which is what actually gets reused run to run.
#
# CARGO_PROFILE_*_DEBUG=0: `cargo test`/`clippy`/`doc` build in the dev/test
# profile, whose default carries full debug info. Nothing here reads a
# backtrace or attaches a debugger — these are CI checks watching exit codes
# and stdout — so that debug info is link time and cache bytes spent on
# something never used.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # The one job in this workflow that reads the PR diff, so every other job
  # that needs to know "does this PR touch X" reads its output instead of
  # diffing again itself — a job-level `if` cannot read the diff on its own.
  # It answers two independent questions from the same diff: whether the
  # server image needs building (`build-image`, `check-publish-image`), and
  # whether the Windows jobs need running (`test-windows`,
  # `install-windows`). Both used to be answered separately — one as a step
  # inside the old single `ci` job, one in its own `windows-changes` job —
  # but the fetch-and-diff underneath them is identical, so it happens once
  # here and each question is just its own regex over the same file list.
  #
  # On a push to `main` both outputs are true unconditionally: the two jobs
  # they gate run on every push regardless of what changed, so there is
  # nothing to compute there.
  #
  # The same holds while the repository is public. GitHub-hosted runners
  # cost nothing for a public repository, Windows included, so skipping
  # buys nothing but a pull request tested less than main will be. The
  # diff only decides anything for a private repository, where Windows
  # minutes are billed double, and it starts deciding by itself the day the
  # repository's visibility changes: `github.event.repository.private`.
  #
  # A third question, `deploy`, is asked of the diff whatever the
  # repository's visibility: whether `check-release-image` runs. Its cost
  # is not runner minutes but other people's uptime (GHCR, GitHub's
  # attestations API, Sigstore), so a pull request that cannot have changed
  # what it checks is not made to depend on them. A push to `main` runs it.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
      windows: ${{ steps.diff.outputs.windows }}
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Does this change touch the server image, the Windows client or the deploy?
        id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — the image, Windows and release-image jobs run unconditionally."
            printf '%s\n' image=true windows=true deploy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This job checks out at the default depth of 1. Deepening it to
          # fetch-depth: 0 would pull the entire history on every run to
          # answer one question about one commit; fetching that one commit
          # costs a second and leaves the rest of the job as it was. The
          # checkout of a pull request is the merge commit, so the two-dot
          # `diff base HEAD` is exactly what the PR does to the base tree.
          base='${{ github.event.pull_request.base.sha }}'
          if ! git cat-file -e "$base^{commit}" 2>/dev/null \
            && ! git fetch --no-tags --depth=1 origin "$base"; then
            # A force-push to the base branch can leave that commit
            # unreachable. A diff that cannot be read is not evidence of
            # nothing: run both.
            echo "::warning::Could not reach base commit $base, so the server image, Windows and release-image jobs run rather than skip."
            printf '%s\n' image=true windows=true deploy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames deliberately. With rename detection on, moving
          # crates/foo.rs to docs/foo.md is reported as the single path
          # docs/foo.md — the side of the move that matters here vanishes
          # from the list, and the change reads as docs-only.
          changed="$(git diff --no-renames --name-only "$base" HEAD)"
          echo "Changed in this pull request:"
          echo "$changed"

          # Asked of the diff even in a public repository; see above.
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/verify-release-image\.sh|\.github/workflows/(ci|deploy|release)\.yml)$'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing in scripts/verify-release-image.sh, deploy.yml, release.yml or this workflow changed, so check-release-image was skipped. It runs unconditionally on every push to main."
          fi

          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "Public repository: runners are free, so the image and the Windows jobs run on every pull request."
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This workflow itself counts for both: a change to either gate
          # below, or to the jobs it feeds, is only proven by running them.
          if printf '%s\n' "$changed" | grep -Eq '^(crates/|deploy/|Cargo\.(toml|lock)$|scripts/(release-image|image-pullable)\.sh$|\.github/workflows/(ci|release)\.yml$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            # One line on purpose: a `\` continuation inside a quoted
            # string keeps the next line's indentation in the annotation.
            echo "::notice::Nothing under crates/, deploy/, Cargo.toml, Cargo.lock, scripts/release-image.sh, scripts/image-pullable.sh, release.yml or this workflow changed, so the server image builds were skipped. They run unconditionally on every push to main."
          fi

          # .github/actions/ too: the windows jobs set up Rust through the
          # local rust-setup action, so a change there is only proven on
          # Windows by running them. And what the Windows installer
          # test runs: install.ps1, its own script, the packer release.yml
          # uses and the stand-in release server.
          if printf '%s\n' "$changed" | grep -Eq '^(crates/|Cargo\.(toml|lock)$|install\.ps1$|npm/install\.js$|scripts/(installer-test\.ps1|package-release\.py|fake-release-server\.py)$|\.github/workflows/(ci|release)\.yml$|\.github/actions/)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing under crates/, .github/actions/, Cargo.toml, Cargo.lock, install.ps1, npm/install.js, the installer test's scripts, release.yml or this workflow changed, so the Windows jobs were skipped. They run unconditionally on every push to main."
          fi

  # Eight checks that are plain scripts against files already in the
  # checkout: no Rust toolchain, no compile, a few seconds combined. Its own
  # job so a broken script, doc link, formula, manifest or compose leak fails
  # in seconds, in parallel with the Rust jobs and `build-image`, rather than
  # waiting on minutes of Rust and Docker work nobody needed to see first.
  check-scripts:
    name: check-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Worker that publishes recall.pimlabs.id/install. Its routing is
      # easy to get subtly wrong in ways no one would notice: a redirect
      # where a 410 belongs would forward a stale client's POST /sync to a
      # host it never authenticated against, and an upstream failure served
      # as 200 would pipe a truncated script into someone's shell.
      - name: Install worker still routes correctly
        run: |
          node scripts/install-worker-test.js
          python3 scripts/wrangler-check.py

      # recall-worker holds a device key and the `claude` login, and is safe
      # beside the server only while it has no port, no ingress label or
      # network, and no volume the server has. One YAML line undoes any of
      # those, so each is asserted, and each assertion is shown to fail on a
      # copy of the file with that line added. The same for what the
      # database procedures rely on in all three files: the container names
      # the restore stops by, and the server's stop grace period. It also
      # lints deploy/README.md and docs/**/*.md themselves: a fenced sh/bash
      # block that runs `docker compose exec/logs/restart/stop/start/ps/run`
      # with no `-f` acts on whichever compose file is on disk by default,
      # not the one the surrounding prose means.
      - name: The compose files keep the worker unreachable and the procedures' names
        run: python3 scripts/compose-check.py

      # Not a style check. The doc set has been reorganised twice — `docs/`
      # split into reference/ and history/, `tests/` renamed to `fixtures/` —
      # and a link left pointing at nothing is exactly what neither move
      # would have announced.
      - name: Documentation links still resolve
        run: python3 scripts/link-check.py

      # A tag like `@v5` is a pointer the action's owner can move, and a
      # moved tag runs new code with this repository's secrets. Every
      # `uses:` names a full commit SHA with its version in a comment, which
      # .github/dependabot.yml reads to propose updates; this keeps a new
      # job from bringing a tag back in.
      - name: Every action is pinned to a commit
        run: python3 scripts/actions-pin-check.py

      - name: Shipped shell scripts still parse
        run: |
          bash -n install.sh
          bash -n scripts/compat-check.sh
          bash -n scripts/api-doc-check.sh
          bash -n scripts/trusted-ip-check.sh
          bash -n scripts/tls-trusted-ip-check.sh
          bash -n scripts/restore-check.sh
          bash -n scripts/release.sh
          bash -n deploy/backup-offbox.sh
          bash -n scripts/backup-offbox-check.sh
          bash -n .claude/hooks/session-start.sh
          bash -n scripts/push-tap.sh
          bash -n scripts/update-formula-check.sh
          bash -n scripts/capture-wire-fixtures.sh
          bash -n scripts/installer-test.sh
          bash -n scripts/release-image.sh
          bash -n scripts/image-pullable.sh
          sh -n deploy/fetch-release.sh

      # The formula rewrite runs once per release, from CI or from a laptop,
      # and a mistake in it surfaces later on someone else's machine as a
      # checksum error. Checked here against the committed formula, which a
      # real release wrote — no network, no release needed.
      - name: Formula rewrite round-trips and refuses cleanly
        run: ./scripts/update-formula-check.sh

      # winget manifest generation, against a fixture checksums.txt (its
      # hashes are not real archive digests, only syntactically valid ones —
      # see packaging/winget/fixtures/checksums.txt) and the JSON schemas
      # vendored under packaging/winget/schemas/, so this needs no release
      # and no live fetch from microsoft/winget-cli. See that directory's
      # SOURCE.txt for where the schemas came from.
      - name: winget manifest still matches the schema
        run: |
          pip install --quiet --disable-pip-version-check jsonschema PyYAML
          python3 packaging/winget/test_manifest.py

      # The off-box backup runs against a stub rclone, so it needs no bucket
      # and no credentials. What it asserts cannot be seen from the script's
      # output: a run that wrongly deleted the remote and one that did not
      # look identical from here.
      - name: Off-box backup never asks rclone to delete
        run: ./scripts/backup-offbox-check.sh

  # A release's archive names are a contract between release.yml and every
  # installer, and until this job a mistake in it showed only at the next
  # real release (0.4.3 failed that way, on a different step). So each pull
  # request builds a release here by running release.yml's own Package
  # steps, as that file has them, for every matrix entry, against tiny fake
  # binaries (scripts/run-package-steps.py), and checks that what they wrote
  # is exactly the set of names scripts/package-release.py --name gives. A
  # checksums.txt is made the way release.yml makes it, and one more release
  # in the layout v0.4.5 and older have. It serves both on 127.0.0.1
  # (scripts/fake-release-server.py, python3's http.server plus GitHub's
  # /releases/latest redirect), then runs install.sh, npm/install.js and
  # deploy/fetch-release.sh against them, for "latest" and pinned versions
  # on both sides of the cutoff, and runs what each installed. A wrong
  # checksum, a symlinked binary and a non-loopback RECALL_TEST_RELEASES_URL
  # must install nothing. install.ps1, and npm/install.js's zip path, get
  # the same on both Windows architectures, in `install-windows` below.
  #
  # Not gated on the diff: it needs no Rust toolchain and takes seconds,
  # and what it protects is spread across install.sh, npm/, deploy/,
  # scripts/ and two workflows, a list a path filter would get wrong.
  test-installers:
    name: test-installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installers against a local release, new names and old
        run: |
          pip install --quiet --disable-pip-version-check PyYAML
          ./scripts/installer-test.sh

  # The Rust checks on Linux, as two jobs that run side by side: `lint`
  # reads the code, `test-linux` runs it. They were one job, and at four
  # minutes it was the one the whole run waited for, though its steps
  # needed nothing from one another: clippy and rustdoc share no build with
  # the tests. Split, the run waits for the longer of the two, not both.
  # The Docker image has its own job below, since it needs Docker rather
  # than cargo and is gated on the diff.
  #
  # `lint` is everything that reads the code rather than running it:
  # formatting, clippy, rustdoc and the server's dependency tree.
  # Formatting and rustdoc are the same on every platform, so they run here
  # only; clippy runs on Windows too, in `test-windows`, for the code only
  # Windows compiles.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain (stable, rustfmt + clippy) and Swatinem/rust-cache, saved
      # only from main (see .github/actions/rust-setup for why). A
      # shared-key of its own, not `test-linux`'s: clippy and rustdoc build
      # the dependencies as metadata only, the tests as code, so the two
      # jobs' target directories have next to nothing in common. And two
      # jobs saving under one key race to write it: whichever finishes first
      # is the only one ever restored.
      - name: Set up Rust (stable, rustfmt + clippy) and the cache
        uses: ./.github/actions/rust-setup
        with:
          cache-shared-key: rust-linux-lint

      - name: cargo fmt
        run: cargo fmt --all --check

      # recall-server uses recall-worker's merge with the worker's `client`
      # feature off, so the process that faces the internet carries no HTTP
      # client. Only the feature keeps it out, and a dependency that turned
      # it on would put it back without a word, so the server's normal
      # dependency tree is asked directly. The tests' own dev-dependency on
      # the client is not in that tree.
      - name: The server carries no HTTP client
        run: |
          if cargo tree -p recall-server -e normal --locked -i reqwest 2>/dev/null | grep -q reqwest; then
            cargo tree -p recall-server -e normal --locked -i reqwest
            echo "::error::reqwest is in recall-server's normal dependency tree"
            exit 1
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `missing_docs` is denied in each library crate, so an undocumented
      # public item already fails clippy above, and every build. This
      # catches the other half: a doc comment that links to something that
      # no longer exists.
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The workspace's tests, then the scripts that drive a real server on a
  # real socket. It is still the longest Rust job, so it builds once: the
  # test build also compiles the server binary the scripts run.
  test-linux:
    name: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain (stable) and Swatinem/rust-cache, saved only from main
      # (see .github/actions/rust-setup for why), and cargo-nextest. No
      # rustfmt or clippy: `lint` runs those. shared-key is set so this
      # job's cache stays its own: `lint` above has its own, `test-windows`
      # below keys by `matrix.os`, and without a key here this job's entries
      # would collide with whatever a same-named job elsewhere set saves.
      - name: Set up Rust (stable), cargo-nextest and the cache
        uses: ./.github/actions/rust-setup
        with:
          components: ''
          cache-shared-key: rust-linux
          nextest: 'true'

      # cargo-nextest rather than `cargo test`: every test in a process of
      # its own, spread over every core at once, where `cargo test` runs one
      # test binary after another and waits for each binary's slowest test
      # before starting the next. The same tests, each run once; on four
      # cores, like this runner's, the suite's run went from 70 seconds to
      # 44. The `ci` profile (.config/nextest.toml) keeps going past a
      # failure and lists every failure again at the end of the log.
      #
      # With TMPDIR behind a symlink, which is what macOS has by default:
      # its per-user temporary directory lives under /var, a symlink to
      # /private/var. The binary finds its project root with `git rev-parse
      # --show-toplevel`, and git resolves symlinks — so a fixture built
      # from the unresolved spelling and a path the binary prints are
      # different strings. Seven tests could not pass on macOS while this
      # runner stayed green, because /tmp here is a real directory and both
      # spellings agree. One symlink is the entire difference, so the runner
      # has one.
      #
      # Once, the macOS way only. The suite used to run here twice, with a
      # real /tmp and then behind the symlink, which cost 67 seconds for the
      # second pass. The real-directory spelling is still run by
      # `test-windows`, and by every `cargo test` a developer runs on Linux;
      # the spelling nothing else here would run is the one a Mac has.
      - name: cargo nextest, with TMPDIR behind a symlink (what macOS has)
        run: |
          mkdir -p "$RUNNER_TEMP/real"
          ln -sfn "$RUNNER_TEMP/real" "$RUNNER_TEMP/link"
          TMPDIR="$RUNNER_TEMP/link" cargo nextest run --workspace --locked --profile ci --no-fail-fast

      # nextest does not run doctests: rustdoc compiles each one into a
      # program of its own, which nextest has no way to list. So they run
      # here, as `cargo test` ran them before, against the libraries the
      # build above already compiled.
      - name: cargo test --doc
        run: cargo test --doc --workspace --locked

      # The four checks below run a real recall-server: the one the test
      # build above compiled, since the server's integration tests run its
      # binary. They used to run a release build, compiled here for them
      # alone, at 45 seconds (fat LTO, one codegen unit). What they check is
      # what the server says on the wire, which the optimisation level does
      # not change; the dev build also has the debug assertions and overflow
      # checks the release build leaves out. `build-image` still compiles
      # an optimised binary, inside Docker, and runs it, and release.yml
      # compiles the release profile's own on every release. Asserted
      # first, so a test build that one day stops leaving the binary behind
      # fails here, by name, and not as a server that never came up.
      - name: The test build left the server binary behind
        run: |
          if [ ! -x target/debug/recall-server ]; then
            echo "::error::target/debug/recall-server is missing: the test build no longer builds it, and the checks below run it."
            exit 1
          fi

      # docs/reference/api.md describes a frozen compatibility surface, so it is
      # asserted rather than trusted: status codes, error wording, field
      # order, and the null-versus-empty-string distinction, against a real
      # server on a real socket.
      - name: API reference still matches the server
        run: ./scripts/api-doc-check.sh target/debug/recall-server

      # Rate limiting runs before auth, so the bucket key is a security
      # boundary: a client that can pick its own gets unlimited attempts at
      # the token. Driven on a real socket, because the unit tests only cover
      # client_ip in isolation.
      - name: Rate-limit bucket cannot be chosen by the client
        run: ./scripts/trusted-ip-check.sh target/debug/recall-server

      # Same property, direct TLS: with no ingress in front and
      # RECALL_TRUSTED_IP_HEADER left unset, does the rate limiter still key
      # on the real socket peer over an actual TLS handshake? Runs against a
      # self-signed certificate generated in the script itself — no ACME, no
      # network dependency, since the client-IP rule is what this checks,
      # not certificate issuance.
      - name: Rate-limit bucket cannot be chosen by the client, over direct TLS
        run: ./scripts/tls-trusted-ip-check.sh target/debug/recall-server

      # The restore, the backups taken by hand and the switch back to the
      # rollback journal are what an owner pastes when something is already
      # wrong, and under WAL their mistakes are silent: a WAL left beside a
      # restored file brings back the database it replaced. So deploy/README.md's
      # own blocks are run, against a real server, through a stand-in `docker`.
      - name: The database procedures in deploy/README.md work as written
        run: ./scripts/restore-check.sh target/debug/recall-server

  # 124 seconds of a 177-second run — 70% of the whole thing — went into the
  # steps below, on runs that could not possibly have learned anything from
  # them. Of the eight pull requests merged on 2026-09-18, five (#58, #61,
  # #62, #63, #64) changed only documentation, a Homebrew formula, shell
  # scripts and this workflow, and each paid the full 124s. So on a pull
  # request this job runs only when the diff touches something the image is
  # built from — `plan` above answers that, since a job-level `if` cannot
  # read the diff itself.
  #
  # On a push to main it runs unconditionally, whatever the diff says. That
  # asymmetry is the entire safety argument and is not an oversight: the
  # list of paths `plan` checks is a guess about what the image depends
  # on, and a guess this cheap will eventually be wrong. `.dockerignore`
  # decides what even reaches the daemon; a future Dockerfile could COPY
  # something nobody thought to list there. When the filter turns out too
  # narrow, the miss surfaces as a red build on main, which start-release.yml
  # refuses to tag, rather than as a broken image on the server. Skipping on
  # main too would trade that for finding out from production, which is the
  # failure this job exists to prevent.
  #
  # `paths:` under `on:` would have been fewer lines and the wrong tool: it
  # skips the whole workflow, tests included, and a required check that
  # never runs leaves the PR blocked rather than passing.
  #
  # No Rust toolchain or rust-cache here: the Dockerfile's `source` stage
  # compiles recall-server (and recall-worker) from scratch inside its own
  # rust:1-alpine container, so this job needs nothing from the cargo jobs
  # above — rebuilding inside Docker is simplest and correct, since the
  # alternative (a cargo job building a release binary, uploading it as an
  # artifact, and the Dockerfile taught to accept a prebuilt one) is more
  # workflow and image surface for a build Docker already knows how to do
  # itself, without rust-cache's warmth either way.
  build-image:
    name: build-image
    needs: plan
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A second, non-default builder, used only by the two `buildx build`
      # calls below (`--builder "$BUILDER"`). `docker build` a few lines down
      # keeps using the original one untouched: those calls pass `--network
      # host` to reach the plain `python3 -m http.server` below over
      # 127.0.0.1, which needs the classic builder's network namespace, not
      # a container-driver builder's own — buildx's `--network host` would
      # need the builder itself created with that driver option to do the
      # same, and that is a second thing to get right for no benefit, since
      # nothing downstream of a release fetch is compile-heavy enough for a
      # layer cache to matter. use: false is what keeps `docker build`
      # pointed at the original builder rather than this new one.
      - name: Set up a cache-backed builder for the source build
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false

      # BuildKit's `type=gha` cache talks to the Actions cache service with
      # ACTIONS_RUNTIME_TOKEN and the cache URLs, which the runner hands
      # only to JavaScript actions, never to a `run:` step. Without this,
      # `docker buildx build --cache-to type=gha` below fails for want of a
      # token. It exports those values into the environment of the steps
      # after it, and nothing else.
      - name: Expose the Actions cache service to the build step
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The image, both ways it can be built. This is where a crate rename
      # slipped through once: the Dockerfile has no file extension and was
      # missed by the search that updated everything else.
      #
      # `source` compiles recall-server from this checkout. `release` is what
      # a deployment runs, and there is no release of an unmerged change to
      # point it at, so this assembles one: the binary the source build just
      # made (musl, static, the same kind the release publishes), packed and
      # checksummed the way release.yml packs it, served from a local
      # directory. The download, the checksum check and the runtime around
      # them are then exercised exactly as a deploy exercises them. A
      # tampered checksum must stop the build, so that is tried too.
      #
      # The two `source` builds below run on a runner that starts every time
      # with an empty Docker cache, so without help each one recompiles
      # recall-server (and recall-worker) from nothing. GitHub's
      # actions/cache backend (`type=gha`) is BuildKit's, not cargo's, but it
      # works the same way for this Dockerfile: a layer is skipped when
      # neither its instructions nor its input changed, so a docs-only push
      # to main (the image still builds unconditionally there) replays every
      # layer from cache. The Dockerfile's `source` stage uses cargo-chef so
      # this pays off for ordinary code changes too, not just docs-only
      # ones: a PR that touches crates/ without touching Cargo.toml/
      # Cargo.lock keeps the base image, apk/npm layers AND the `cargo chef
      # cook` layer (dependencies, compiled once and keyed on the recipe
      # alone) from cache, and only recompiles the crates that actually
      # changed. Before cargo-chef, any crates/ change invalidated the one
      # layer that both compiled dependencies and the crates, so a doc
      # comment change here paid for a full dependency rebuild same as a
      # real code change did. `mode=max` on both so the cache holds every
      # intermediate layer (the cook layer and recall-server's own compile
      # included), not only the ones the final image is made of.
      #
      # Both `source` builds pass RECALL_FAST_BUILD=1, which compiles
      # without the release profile's LTO and with 16 codegen units instead
      # of one (deploy/Dockerfile's `source` stage says how). These images
      # are never published, and what this job asserts of them (the
      # Dockerfile builds, each binary runs, the release path fetches and
      # checks an archive, a bad checksum is refused) holds of either
      # profile. On a change to server code, compiling the workspace's own
      # crates took about 85 seconds with the release profile and about 20
      # without its LTO, measured on four cores. The shipped profile is
      # still compiled on every release, by release.yml's own
      # `cargo build --release`, which never reads this argument.
      - name: Server image builds, from source and from a release
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -eu
          # Main writes the layer cache and a PR only reads it, for the same
          # reason rust-cache saves only from main: an entry per PR branch
          # would crowd main's out of the repository's cache quota. The
          # scope is named for the fast profile, and only the two builds
          # below read or write it, so no build with the release profile
          # ever finds these layers.
          cache_to=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            cache_to="--cache-to type=gha,scope=recall-docker-source-fast,mode=max"
          fi
          # shellcheck disable=SC2086 # cache_to is empty or several words on purpose
          docker buildx build --builder "$BUILDER" --load \
            --cache-from type=gha,scope=recall-docker-source-fast $cache_to \
            -f deploy/Dockerfile --build-arg RECALL_SOURCE=source \
            --build-arg RECALL_FAST_BUILD=1 -t recall-server-ci .
          # The worker's image from source too: its own target, whose
          # binary stage is picked by the same argument.
          # shellcheck disable=SC2086
          docker buildx build --builder "$BUILDER" --load \
            --cache-from type=gha,scope=recall-docker-source-fast $cache_to \
            -f deploy/Dockerfile --target worker --build-arg RECALL_SOURCE=source \
            --build-arg RECALL_FAST_BUILD=1 -t recall-worker-ci .

          # A version after v0.4.5, so deploy/fetch-release.sh asks for the
          # archive names and layout every release since has: packed by
          # scripts/package-release.py, as release.yml packs them.
          # (The names v0.4.5 and older have are fetched in
          # `test-installers`.)
          ci_version=9.9.9-ci
          rel="$RUNNER_TEMP/releases/v$ci_version"
          mkdir -p "$rel"
          # Both binaries, as a release has them, copied out of the two
          # images just built: each carries, at /usr/local/bin, the file its
          # source stage compiled, byte for byte. This used to build the
          # `source-worker` stage a third time and `--load` it to copy from.
          # Nothing was left to compile, but loading a stage exports the
          # whole of it, and this one is the Rust builder: toolchain,
          # registry and target directory, about a gigabyte, 25 seconds to
          # reach two files. `--output type=local` would write out that same
          # gigabyte, since it too exports the stage's entire filesystem.
          # `rm -v`: each image declares a VOLUME, so `create` made one.
          mkdir -p "$RUNNER_TEMP/bin"
          for name in recall-server recall-worker; do
            id=$(docker create "$name-ci")
            docker cp "$id:/usr/local/bin/$name" "$RUNNER_TEMP/bin/$name"
            docker rm -v "$id"
            python3 scripts/package-release.py "$RUNNER_TEMP/bin/$name" \
              x86_64-unknown-linux-musl "$rel"
          done
          (cd "$rel" && sha256sum *.tar.gz > checksums.txt)
          (cd "$RUNNER_TEMP/releases" && python3 -m http.server 8765 --bind 127.0.0.1 &)
          sleep 1

          docker build -f deploy/Dockerfile --network host \
            --build-arg RECALL_VERSION="$ci_version" \
            --build-arg RECALL_RELEASES_URL=http://127.0.0.1:8765 \
            -t recall-server-rel .
          docker run --rm --entrypoint recall-server recall-server-rel version
          docker build -f deploy/Dockerfile --network host --target worker \
            --build-arg RECALL_VERSION="$ci_version" \
            --build-arg RECALL_RELEASES_URL=http://127.0.0.1:8765 \
            -t recall-worker-rel .
          docker run --rm --entrypoint recall-worker recall-worker-rel version
          # The worker merges with the CLI, so its image must carry it.
          docker run --rm --entrypoint sh recall-worker-rel -c 'command -v claude'

          # Every digit replaced, so the digest is wrong whatever it was.
          sed -i 's/^[0-9a-f]*/'"$(printf '0%.0s' $(seq 64))"'/' "$rel/checksums.txt"
          cat "$rel/checksums.txt"
          if docker build -f deploy/Dockerfile --network host --no-cache-filter release \
               --build-arg RECALL_VERSION="$ci_version" \
               --build-arg RECALL_RELEASES_URL=http://127.0.0.1:8765 \
               -t recall-server-bad . ; then
            echo "::error::the image built from an archive that does not match its checksum"
            exit 1
          fi
          # The worker's binary comes from its own stage, fetched and
          # checked separately, so a check that holds for the server says
          # nothing about it.
          if docker build -f deploy/Dockerfile --network host --target worker \
               --no-cache-filter release-worker \
               --build-arg RECALL_VERSION="$ci_version" \
               --build-arg RECALL_RELEASES_URL=http://127.0.0.1:8765 \
               -t recall-worker-bad . ; then
            echo "::error::the worker image built from an archive that does not match its checksum"
            exit 1
          fi

          # The deploy asks the server for its health from *inside* the
          # image, since neither compose file publishes 8787 to the host. So
          # the tool it asks with has to exist in the image. Asserted here,
          # on the image a deploy builds, rather than discovered on a server,
          # which is how the previous health check spent months being
          # impossible without anyone noticing.
          docker run --rm --entrypoint sh recall-server-rel -c 'command -v wget'

  # The images release.yml publishes, built here the way its `build-image`
  # legs build them: the same script, Dockerfile targets, build arguments
  # and provenance, one leg per architecture on a runner of that
  # architecture, with push=false, then each image's claude CLI and binary
  # run on that runner. `build-image` above proves the Dockerfile builds;
  # this proves the release's per-architecture builds do, before a release
  # finds out. Never under emulation: under QEMU the arm64 npm install of
  # the claude CLI died with an illegal instruction and the build hung for
  # the job's whole timeout. Nothing is pushed and no credential is used.
  #
  # From the newest published release's binaries, since an unmerged change
  # has no release: the Dockerfile and fetch-release.sh under test, the
  # binaries from the newest release, as `releases/latest` names it.
  # Gated on the same diff as `build-image`.
  check-publish-image:
    name: check-publish-image (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: The release's image builds and runs on this architecture
        timeout-minutes: 20
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          latest=$(curl -fsS -o /dev/null -w '%{redirect_url}' \
            https://github.com/pimlabs/recall/releases/latest)
          version="${latest##*/v}"
          echo "Newest release: $version ($latest)"
          scripts/release-image.sh build "$version" "$(git rev-parse --short HEAD)" "$ARCH" check

  # What deploy.yml asks before a server pulls anything: does the tag name
  # the image the release built? scripts/verify-release-image.sh resolves
  # it to a digest and checks the index's version and the digest's
  # attestation, with `gh attestation verify` and this job's token, which
  # is why this job, alone here, has `attestations: read`. Run on a real
  # runner against the newest published release, so a change to the script,
  # to the deploy, or to how release.yml attests is proven here and not
  # first found by a deploy. Then once more with a version the image does
  # not claim, which must fail, and fail for that reason, so the check is
  # shown able to fail.
  #
  # The newest release is the newest v* tag after 0.4.6 (the last with no
  # image; deploy.yml's LAST_BUILT_ON_SERVER), by sort -V, whose release
  # run's publish-image job has succeeded: a release in progress has its
  # tag before its images, and main must not go red in between. Reading
  # the run is why this job also has `actions: read`. Gated on
  # `plan`'s `deploy` answer, even while the repository is public: see
  # `plan`.
  check-release-image:
    name: check-release-image
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The newest release's images verify, and a mismatch does not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Newest first. A tag exists from the moment a release starts,
          # minutes before its publish-image job pushes the images, so a
          # push to main in between would find nothing to verify. A tag
          # counts once the latest attempt of publish-image in its release
          # run succeeded; until then, the release before it is checked.
          newest=
          for v in $(git ls-remote --tags --refs origin 'v*' \
            | sed -n 's|.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' \
            | { cat; echo 0.4.6; } | sort -Vr); do
            [ "$v" = 0.4.6 ] && break
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=v$v&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            published=
            if [ -n "$run" ]; then
              published=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq '[.jobs[] | select(.name == "publish-image" and .conclusion == "success")] | length')
            fi
            if [ "${published:-0}" -gt 0 ]; then
              newest=$v
              break
            fi
            echo "::notice::v$v's release run (${run:-none found}) has not published its images, so the release before it is checked instead."
          done
          if [ -z "$newest" ]; then
            echo "::error::No release after 0.4.6 has published its images, so there is no image to verify."
            exit 1
          fi
          echo "Newest release with published images: $newest"

          out="$RUNNER_TEMP/verified"
          GITHUB_OUTPUT="$out" scripts/verify-release-image.sh "$newest"
          for name in server worker; do
            if ! grep -Eq "^${name}_digest=sha256:[0-9a-f]{64}\$" "$out"; then
              echo "::error::verify-release-image.sh passed for $newest but gave no ${name}_digest."
              exit 1
            fi
          done

          # 0.0.0's name on the image $newest's tag names: the index says
          # $newest, so this must fail on the version, before anything else.
          if GITHUB_ACTIONS=false scripts/verify-release-image.sh 0.0.0 "$newest" 2> "$RUNNER_TEMP/mismatch"; then
            echo "::error::verify-release-image.sh accepted $newest's image as 0.0.0."
            exit 1
          fi
          cat "$RUNNER_TEMP/mismatch"
          if ! grep -q "says it is version '$newest', not 0.0.0" "$RUNNER_TEMP/mismatch"; then
            echo "::error::verify-release-image.sh refused $newest's image as 0.0.0, but not because of the version (its output is above)."
            exit 1
          fi
          echo "Refused as 0.0.0, as it must be."

  # The client only — recall-server and recall-worker are Linux-only by
  # design (see deploy/Dockerfile and their own crate docs), so they are
  # excluded rather than tested and ignored. `recall`'s own integration tests still pull it in as
  # a dev-dependency (it runs a real server in-process), which is why this
  # needs a C toolchain: rusqlite's `bundled` feature compiles SQLite from
  # source, and windows-latest carries the MSVC toolchain cc-rs needs for
  # that automatically — the same reason release.yml's msvc builds need
  # nothing extra either.
  #
  # Both architectures the release builds. arm64 is here rather than first
  # met at release time because `ring`, under reqwest's TLS, compiles C and
  # assembly for its target: if that fails on windows-11-arm it fails the
  # release's build matrix, and `publish-github` waits for every leg, so one
  # architecture would hold back every channel.
  #
  # Two jobs per architecture: this one tests the client, `install-windows`
  # below installs it. They were one job, the slowest in the run, whose
  # installer test waited behind the whole test run for nothing but the
  # recall.exe that run happened to leave behind, a binary that is a build
  # of its own. Side by side, each waits only for its own work.
  #
  # Skipped on a pull request that touches nothing these jobs test: a
  # Windows runner bills at twice Linux's rate, and the pair cost about as
  # much as the whole Linux job, on docs-only and script-only PRs too. A push
  # to main always runs them, which is what `start-release.yml` checks before
  # it tags. `plan` answers the question on a cheap Linux runner first,
  # since a job-level `if` cannot read the diff itself.
  test-windows:
    name: test-windows (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      # windows-11-arm only: the first thing a job there does that touches
      # a newly written file waits about 30 s, whichever step it is, and
      # nothing after it does. In #170's run a Defender status query that
      # happened to come first took 38 s and the Python packing after it
      # 4 s; without it, the packing took 38 s and the first install 29 s.
      # So the job asks Defender for its status in the background as its
      # very first act, and that one-time wait overlaps the checkout, the
      # cache restore and the build instead of adding to the test. Nothing
      # waits on it, and nothing fails if it does.
      - name: Wake Defender in the background (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-Command', 'Get-MpComputerStatus | Out-Null' -WindowStyle Hidden

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain (stable, and clippy where it runs) and Swatinem/rust-cache,
      # saved only from main (see .github/actions/rust-setup for why). Keyed
      # by matrix.os since the two OSes must not share one cache entry.
      - name: Set up Rust (stable) and the cache
        uses: ./.github/actions/rust-setup
        with:
          components: ${{ matrix.arch == 'x64' && 'clippy' || '' }}
          cache-key: ${{ matrix.os }}

      # No `cargo fmt`: formatting is the same on every platform, and `lint`
      # checks it. Clippy is here for the code only Windows compiles
      # (`cfg(windows)`), and on x64 only: nothing in the workspace depends
      # on the architecture, so arm64 compiles exactly the code x64 has just
      # linted, and a second pass would find nothing the first did not. What
      # arm64 has of its own is native code under `ring`, which clippy does
      # not lint and the tests' build below compiles.
      - name: cargo clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --workspace --exclude recall-server --exclude recall-worker --all-targets --locked -- -D warnings

      # `cargo test`, not nextest as on Linux. Measured on this PR's own run:
      # nextest took 63 s to run what `cargo test` runs in about 50 on
      # windows-11-arm, and no less on x64. It starts a process per test,
      # Windows starts processes slowly, and the CLI tests start several
      # each, so running them side by side traded one cost for a bigger one.
      # --no-fail-fast: a Windows failure in one crate otherwise hides every
      # failure in the crates after it, and each round trip is a CI run.
      # The doctests run as part of it.
      - name: cargo test
        run: cargo test --workspace --exclude recall-server --exclude recall-worker --locked --no-fail-fast

  # install.ps1, on both architectures: parsed, then run against a release
  # built around this checkout's recall.exe. Split from `test-windows`
  # above, whose test run it used to wait for; all it needs is the client,
  # built on its own. Gated on the same diff, for the same reason.
  install-windows:
    name: install-windows (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      # windows-11-arm only: the first thing a job there does that touches
      # a newly written file waits about 30 s, whichever step it is, and
      # nothing after it does. In #170's run a Defender status query that
      # happened to come first took 38 s and the Python packing after it
      # 4 s; without it, the packing took 38 s and the first install 29 s.
      # So the job asks Defender for its status in the background as its
      # very first act, and that one-time wait overlaps the checkout, the
      # cache restore and the build instead of adding to the test. Nothing
      # waits on it, and nothing fails if it does.
      - name: Wake Defender in the background (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-Command', 'Get-MpComputerStatus | Out-Null' -WindowStyle Hidden

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Parsed rather than run: running it for real means downloading a
      # release, and no release has been cut yet at the point a PR that
      # changes it is reviewed. This is the same level of assurance
      # `bash -n` gives the shell scripts in `check-scripts` — syntax only —
      # which is still enough to catch what a hand-edit is most likely to
      # break. Before the Rust setup, since it needs no Rust at all.
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      # Toolchain (stable, no components: nothing here lints) and
      # Swatinem/rust-cache, saved only from main (see
      # .github/actions/rust-setup for why). The same cache-key as
      # `test-windows`, and still a cache of its own: rust-cache adds the
      # job's id to `key`. Deliberately not a read of `test-windows`'s
      # entry: that one holds the tests' build, larger to restore and built
      # with the features the whole test tree unifies to, so the client's
      # own build would still recompile part of it. Its own entry holds
      # exactly what `cargo build -p recall` reuses.
      - name: Set up Rust (stable) and the cache
        uses: ./.github/actions/rust-setup
        with:
          components: ''
          cache-key: ${{ matrix.os }}

      # The client alone, in the dev profile: the recall.exe the installer
      # test packs into its release.
      - name: cargo build -p recall
        run: cargo build -p recall --locked

      # And run: against a release built here around the recall.exe
      # `cargo build` just built, served from 127.0.0.1, in the archive
      # layout of every release after v0.4.5 and in v0.4.5's own, for
      # "latest" and pinned versions on both sides of that cutoff. Under
      # Windows PowerShell 5.1 (`shell: powershell`), which is what the
      # script is written for. Then npm/install.js against the same release,
      # the one place its Windows zip path runs before a real release. The
      # Windows half of `test-installers`; see scripts/installer-test.ps1.
      #
      # The first line names the Python the test packs and serves the
      # release with, and which architecture it was built for: an x64 build
      # on windows-11-arm runs under emulation and nothing else would say
      # so. The image's own is a native ARM64 build today (runner-images'
      # toolset-win-11-arm64.json), so there is no setup-python step; this
      # line is what would show that changing. It uses sysconfig and
      # sys.version rather than `platform`, which asks WMI on Windows and
      # can itself take seconds on a runner that has just started.
      - name: install.ps1 installs from a local release, new names and old
        shell: powershell
        run: |
          python -c "import sys, sysconfig; print(sys.executable, sysconfig.get_platform(), sys.version)"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\installer-test.ps1 target\debug\recall.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # One check that stands for the whole run: green when every job above
  # succeeded or was deliberately skipped by `plan`, red otherwise. It is
  # the one name to require if main ever gets branch protection, so a job
  # `plan` skips (private repository, docs-only change) never leaves a
  # required check waiting, and adding a job never means editing the
  # protection rule. `always()` so it reports even when something it waits
  # on failed or was cancelled.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [plan, check-scripts, test-installers, lint, test-linux, build-image, check-publish-image, check-release-image, test-windows, install-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Not green: $bad"
            exit 1
          fi
