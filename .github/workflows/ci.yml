name: CI

# Deploying is not in here any more. Since 0.4.0 a server runs releases, not
# `main`, so the deploy runs after a release is published: see deploy.yml.
# A push to `main` is checked and nothing else.

on:
  push:
    branches: [main]
  pull_request:

# Pushing again to a pull request makes the run for the commit it replaced
# worthless: nobody is waiting on an answer about a commit that is no longer
# the branch tip. PR #64 took four pushes and ran all four to completion — 198s,
# 216s, 209s, 183s — and only the last one was being read. The minutes matter
# less than the queue: three dead runs sit in front of the live one.
#
# A pull_request run is keyed by its PR number, so the runs on one PR share a
# group and supersede one another. Anything else is keyed by `github.run_id`,
# unique per run, so a push to `main` is alone in its group and always runs
# to the end: `cut-release.yml` refuses to tag a commit whose `ci` job did not
# finish green, and a cancelled run is not green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('uncancellable-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # The same tests again with TMPDIR behind a symlink, which is what
      # macOS has by default: its per-user temporary directory lives under
      # /var, a symlink to /private/var. The binary finds its project root
      # with `git rev-parse --show-toplevel`, and git resolves symlinks — so
      # a fixture built from the unresolved spelling and a path the binary
      # prints are different strings. Seven tests could not pass on macOS
      # while this runner stayed green, because /tmp here is a real directory
      # and both spellings agree. One symlink is the entire difference, so
      # the runner may as well have one.
      - name: cargo test, with TMPDIR behind a symlink (what macOS has)
        run: |
          mkdir -p "$RUNNER_TEMP/real"
          ln -sfn "$RUNNER_TEMP/real" "$RUNNER_TEMP/link"
          TMPDIR="$RUNNER_TEMP/link" cargo test --workspace --locked

      # `missing_docs` is denied in each library crate, so an undocumented
      # public item already fails the build above. This catches the other
      # half: a doc comment that links to something that no longer exists.
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # docs/reference/api.md describes a frozen compatibility surface, so it is
      # asserted rather than trusted: status codes, error wording, field
      # order, and the null-versus-empty-string distinction, against a real
      # server on a real socket.
      - name: API reference still matches the server
        run: |
          cargo build --release -p recall-server --locked
          ./scripts/api-doc-check.sh target/release/recall-server

      # Rate limiting runs before auth, so the bucket key is a security
      # boundary: a client that can pick its own gets unlimited attempts at
      # the token. Driven on a real socket, because the unit tests only cover
      # client_ip in isolation.
      - name: Rate-limit bucket cannot be chosen by the client
        run: |
          cargo build --release -p recall-server --locked
          ./scripts/trusted-ip-check.sh target/release/recall-server

      # The Worker that publishes recall.pimlabs.id/install. Its routing is
      # easy to get subtly wrong in ways no one would notice: a redirect
      # where a 410 belongs would forward a stale client's POST /sync to a
      # host it never authenticated against, and an upstream failure served
      # as 200 would pipe a truncated script into someone's shell.
      - name: Install worker still routes correctly
        run: |
          node scripts/install-worker-test.js
          python3 scripts/wrangler-check.py

      # Not a style check. The doc set has been reorganised twice — `docs/`
      # split into reference/ and history/, `tests/` renamed to `fixtures/` —
      # and a link left pointing at nothing is exactly what neither move
      # would have announced.
      - name: Documentation links still resolve
        run: python3 scripts/link-check.py

      - name: Shipped shell scripts still parse
        run: |
          bash -n install.sh
          bash -n scripts/compat-check.sh
          bash -n scripts/api-doc-check.sh
          bash -n scripts/trusted-ip-check.sh
          bash -n scripts/release.sh
          bash -n deploy/backup-offbox.sh
          bash -n scripts/backup-offbox-check.sh
          bash -n .claude/hooks/session-start.sh
          bash -n scripts/push-tap.sh
          bash -n scripts/update-formula-check.sh
          bash -n scripts/capture-wire-fixtures.sh
          sh -n deploy/fetch-release.sh

      # The formula rewrite runs once per release, from CI or from a laptop,
      # and a mistake in it surfaces later on someone else's machine as a
      # checksum error. Checked here against the committed formula, which a
      # real release wrote — no network, no release needed.
      - name: Formula rewrite round-trips and refuses cleanly
        run: ./scripts/update-formula-check.sh

      # The off-box backup runs against a stub rclone, so it needs no bucket
      # and no credentials. What it asserts cannot be seen from the script's
      # output: a run that wrongly deleted the remote and one that did not
      # look identical from here.
      - name: Off-box backup never asks rclone to delete
        run: ./scripts/backup-offbox-check.sh

      # 124 seconds of a 177-second run — 70% of the whole thing — went into
      # the step below, on runs that could not possibly have learned anything
      # from it. Of the eight pull requests merged on 2026-09-18, five (#58,
      # #61, #62, #63, #64) changed only documentation, a Homebrew formula,
      # shell scripts and this workflow, and each paid the full 124s. So on a
      # pull request the image is built only when the diff touches something
      # it is built from.
      #
      # On a push to main it is built unconditionally, whatever the diff says.
      # That asymmetry is the entire safety argument and is not an oversight:
      # the list of paths below is a guess about what the image depends on,
      # and a guess this cheap will eventually be wrong. `.dockerignore`
      # decides what even reaches the daemon; a future Dockerfile could COPY
      # something nobody thought to list here. When the filter turns out too
      # narrow, the miss surfaces as a red build on main, which
      # cut-release.yml refuses to tag, rather than as a broken image on the
      # server. Skipping on main too would trade that for finding out from
      # production, which is the failure this step exists to prevent.
      #
      # `paths:` under `on:` would have been fewer lines and the wrong tool:
      # it skips the whole workflow, tests included, and a required check that
      # never runs leaves the PR blocked rather than passing.
      - name: Does this change touch the server image?
        id: image
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — the image builds unconditionally."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This job checks out at the default depth of 1. Deepening it to
          # fetch-depth: 0 would pull the entire history on every run to
          # answer one question about one commit; fetching that one commit
          # costs a second and leaves the rest of the job as it was. The
          # checkout of a pull request is the merge commit, so the two-dot
          # `diff base HEAD` is exactly what the PR does to the base tree.
          base='${{ github.event.pull_request.base.sha }}'
          if ! git cat-file -e "$base^{commit}" 2>/dev/null \
            && ! git fetch --no-tags --depth=1 origin "$base"; then
            # A force-push to the base branch can leave that commit
            # unreachable. A diff that cannot be read is not evidence of
            # nothing: build.
            echo "::warning::Could not reach base commit $base, so the server image is built rather than skipped."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames deliberately. With rename detection on, moving
          # crates/foo.rs to docs/foo.md is reported as the single path
          # docs/foo.md — the side of the move that matters here vanishes
          # from the list, and the change reads as docs-only.
          changed="$(git diff --no-renames --name-only "$base" HEAD)"
          echo "Changed in this pull request:"
          echo "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(crates/|deploy/|Cargo\.(toml|lock)$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            # One line on purpose: a `\` continuation inside a quoted
            # string keeps the next line's indentation in the annotation.
            echo "::notice::Nothing under crates/, deploy/, Cargo.toml or Cargo.lock changed, so the server image build was skipped. It runs unconditionally on every push to main."
          fi

      # The image, both ways it can be built. This is where a crate rename
      # slipped through once: the Dockerfile has no file extension and was
      # missed by the search that updated everything else.
      #
      # `source` compiles recall-server from this checkout. `release` is what
      # a deployment runs, and there is no release of an unmerged change to
      # point it at, so this assembles one: the binary the source build just
      # made (musl, static, the same kind the release publishes), packed and
      # checksummed the way release.yml packs it, served from a local
      # directory. The download, the checksum check and the runtime around
      # them are then exercised exactly as a deploy exercises them. A
      # tampered checksum must stop the build, so that is tried too.
      - name: Server image builds, from source and from a release
        if: steps.image.outputs.build == 'true'
        run: |
          set -eu
          docker build -f deploy/Dockerfile --build-arg RECALL_SOURCE=source -t recall-server-ci .

          rel="$RUNNER_TEMP/releases/v0.0.0-ci"
          mkdir -p "$rel"
          docker build -f deploy/Dockerfile --target source -t recall-server-bin .
          id=$(docker create recall-server-bin)
          docker cp "$id:/out/recall-server" "$rel/recall-server_linux_amd64"
          docker rm "$id"
          tar -czf "$rel/recall-server_linux_amd64.tar.gz" -C "$rel" recall-server_linux_amd64
          rm "$rel/recall-server_linux_amd64"
          (cd "$rel" && sha256sum *.tar.gz > checksums.txt)
          (cd "$RUNNER_TEMP/releases" && python3 -m http.server 8765 --bind 127.0.0.1 &)
          sleep 1

          docker build -f deploy/Dockerfile --network host \
            --build-arg RECALL_VERSION=0.0.0-ci \
            --build-arg RECALL_RELEASES_URL=http://127.0.0.1:8765 \
            -t recall-server-rel .
          docker run --rm --entrypoint recall-server recall-server-rel version

          # Every digit replaced, so the digest is wrong whatever it was.
          sed -i 's/^[0-9a-f]*/'"$(printf '0%.0s' $(seq 64))"'/' "$rel/checksums.txt"
          cat "$rel/checksums.txt"
          if docker build -f deploy/Dockerfile --network host --no-cache-filter release \
               --build-arg RECALL_VERSION=0.0.0-ci \
               --build-arg RECALL_RELEASES_URL=http://127.0.0.1:8765 \
               -t recall-server-bad . ; then
            echo "::error::the image built from an archive that does not match its checksum"
            exit 1
          fi

          # The deploy asks the server for its health from *inside* the
          # image, since neither compose file publishes 8787 to the host. So
          # the tool it asks with has to exist in the image. Asserted here,
          # on the image a deploy builds, rather than discovered on a server,
          # which is how the previous health check spent months being
          # impossible without anyone noticing.
          docker run --rm --entrypoint sh recall-server-rel -c 'command -v wget'

  # The client only — recall-server is Linux-only by design (see
  # deploy/Dockerfile and its own crate docs), so it is excluded rather than
  # tested and ignored. `recall`'s own integration tests still pull it in as
  # a dev-dependency (it runs a real server in-process), which is why this
  # needs a C toolchain: rusqlite's `bundled` feature compiles SQLite from
  # source, and windows-latest carries the MSVC toolchain cc-rs needs for
  # that automatically — the same reason release.yml's msvc builds need
  # nothing extra either.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude recall-server --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude recall-server --locked

      # Parsed rather than run: running it for real means downloading a
      # release, and no release has been cut yet at the point a PR that
      # changes it is reviewed. This is the same level of assurance
      # `bash -n` gives the shell scripts below — syntax only — which is
      # still enough to catch what a hand-edit is most likely to break.
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
