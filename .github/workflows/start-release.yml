name: Start a release

# One tap from the GitHub mobile app: Actions → Start a release → Run workflow.
#
# It exists because a tag is the one step of a release that needed a laptop.
# This reads the version from main, creates `v<version>` there, and starts
# Build a release (build-release.yml) on that tag. Nothing reaches a
# registry from here: that is Publish a release (publish.yml), run
# afterwards and approved in its release-* environments by the owner. This
# only saves typing a git command.
#
# Two things GitHub does are load-bearing here:
#
#   - A tag pushed with GITHUB_TOKEN starts no workflow at all, deliberately,
#     so pushing it alone would produce a tag and nothing else. Build a
#     release is therefore dispatched explicitly — `workflow_dispatch` is the documented
#     exception to that rule.
#   - It is dispatched *on the tag*, so the run's ref is `refs/tags/v…`, and
#     what it builds is exactly what the tag names.
on:
  workflow_dispatch:

# One at a time: two taps must not race to create the same tag.
concurrency:
  group: start-release
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write # dispatch Build a release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, and this run is on $GITHUB_REF."
            exit 1
          fi

      - name: Which version
        id: version
        run: |
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          npm_v=$(grep -m1 '"version"' npm/package.json | cut -d'"' -f4)
          if [ "$cargo_v" != "$npm_v" ]; then
            echo "::error::Cargo.toml says $cargo_v and npm/package.json says $npm_v. Bump both in a PR first."
            exit 1
          fi
          echo "tag=v$cargo_v" >> "$GITHUB_OUTPUT"
          echo "Cutting v$cargo_v from $(git rev-parse --short HEAD)"

      # A release of a tree whose CI did not pass is the one thing worth
      # refusing outright: nothing downstream re-runs the test suite.
      #
      # CI runs only when dispatched, and a batch is tested on its
      # integration branch, whose commits are not main's: squash merges
      # land the same tree under new commits. So the run is found by tree,
      # not by commit: the newest dispatched CI run whose commit has the
      # tree main has now. That run must be green, and must not have
      # skipped an image or Windows job: those skip only in a private
      # repository, on a batch that did not touch them, and a dispatch of
      # main runs them all. check-release-image and audit-dependencies may
      # skip; neither tests the tree being tagged.
      - name: CI passed on this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse "$GITHUB_SHA^{tree}")
          run_id=
          while read -r id sha; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq .tree.sha)" = "$tree" ]; then
              run_id=$id
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=workflow_dispatch&per_page=50" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
          if [ -z "$run_id" ]; then
            echo "::error::No dispatched CI run has tested tree ${tree:0:12}, main's tree at $GITHUB_SHA. Dispatch CI on main (or on the batch that produced it), wait for it, then run this again."
            exit 1
          fi
          read -r status conclusion < <(gh run view "$run_id" --json status,conclusion \
            --jq '"\(.status) \(.conclusion // "none")"')
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            not_green=$(gh run view "$run_id" --json jobs --jq \
              '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name): \(if (.conclusion // "") == "" then .status else .conclusion end)"] | join(", ")')
            echo "::error::CI run $run_id on this tree is '$status/$conclusion', not success (${not_green:-no job reported}). Wait for it, or fix it first."
            exit 1
          fi
          skipped=$(gh run view "$run_id" --json jobs --jq \
            '[.jobs[] | select(.conclusion == "skipped") | .name | select(startswith("check-release-image") or startswith("audit-dependencies") | not)] | join(", ")')
          if [ -n "$skipped" ]; then
            echo "::error::CI run $run_id on this tree skipped $skipped. Dispatch CI on main, which runs every job, then run this again."
            exit 1
          fi
          echo "CI: every job green on this tree (run $run_id)"

      # A tag that already exists means this version was released, or
      # started to be. Pointing here, it is an interrupted run and Release is
      # dispatched again — every publish step skips what is already done.
      # Pointing anywhere else, the version was not bumped: refuse, rather
      # than move a tag someone may already have installed from.
      - name: Create the tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$existing" ] || existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$existing" ]; then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "::notice::$TAG already exists here — resuming, nothing already published is republished."
              exit 0
            fi
            echo "::error::$TAG already exists at ${existing:0:8}, not at ${GITHUB_SHA:0:8}. Bump the version in a PR first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "recall ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Start Build a release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run build-release.yml --ref "$TAG" -f tag="$TAG"
          {
            echo "### $TAG is tagged and building"
            echo ""
            echo "**Build a release** is running on \`$TAG\`: the binaries, the GitHub"
            echo "Release, the server's images and the deploy, in about seven minutes."
            echo "Then **Publish a release** on \`$TAG\`, approved in its release-*"
            echo "environments, publishes npm, crates.io and the Homebrew tap."
          } >> "$GITHUB_STEP_SUMMARY"
