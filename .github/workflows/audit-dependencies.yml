name: Audit dependencies

# Checks every dependency actually locked in Cargo.lock against the RustSec
# advisory database. Nothing here builds the workspace or runs its tests —
# `cargo audit` reads the lockfile and the advisory database only, so this
# stays cheap enough to run every week.
#
# Two ways in. ci.yml calls it in a dispatched run whose diff changes a
# manifest or the lockfile, so a dependency change is audited before it
# reaches `main`. The weekly schedule is the one trigger in this repository
# that starts by itself, kept on purpose: an advisory is published against a
# lockfile that did not change, and GitHub's Dependabot alerts do not cover
# RustSec. RUSTSEC-2026-0459 (libsqlite3-sys, 2026-10-30) is in GitHub's
# database only as GHSA-72w2-rjgg-q729, unreviewed and naming no package,
# so it raises no alert; RUSTSEC-2026-0285 (rustls, 2026-09-14) became a
# reviewed advisory on 2026-10-05, nine days after `cargo audit` had made
# this repository fix it.
#
# If this ever reports something, the usual fix is upgrading the affected
# crate to the patched version the advisory names (`cargo update -p <crate>`),
# as RUSTSEC-2026-0285 in rustls was on 2026-09-26. Only if no fixed version
# exists and the advisory genuinely doesn't affect Recall, record that with a
# dated reason in `.cargo/audit.toml`'s `[advisories.ignore]`; otherwise the
# job stays red until a real fix lands.
on:
  schedule:
    # Mondays, off the hour so this doesn't queue with everyone else's
    # midnight/on-the-hour cron jobs.
    - cron: "27 4 * * 1"
  workflow_dispatch:
  workflow_call:

# Only ever reads the checkout and the advisory database it downloads itself.
permissions:
  contents: read

jobs:
  audit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.100.0

      # Prebuilt binary from the project's own GitHub releases, not a
      # from-source `cargo install` — a few seconds instead of a few
      # minutes, so there is nothing here worth layering another cache on
      # top of.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit
