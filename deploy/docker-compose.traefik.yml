# Recall behind an existing Traefik, on a VPS that already routes other
# services the same way.
#
#   cd deploy
#   cp .env.example .env          # fill in RECALL_TOKEN
#   docker compose -f docker-compose.traefik.yml up -d --build
#
# The alternative is docker-compose.yml, which brings its own ingress
# (Cloudflare Tunnel) and needs nothing on the host. Use that one if this
# machine is not already running Traefik. Use this one if it is — a single
# ingress you already understand beats a second one you have to remember.
#
# ---------------------------------------------------------------------------
# THREE THINGS TO CHECK BEFORE THE FIRST RUN
#
#   1. `traefik` below must be the network your Traefik actually attaches to.
#      Find it with:  docker inspect traefik -f '{{json .NetworkSettings.Networks}}'
#   2. `websecure` must be one of your Traefik entrypoints, and `letsencrypt`
#      one of its certificate resolvers. Both are conventional defaults and
#      both are frequently something else.
#   3. RECALL_URL on every client must match the Host rule below.
# ---------------------------------------------------------------------------

name: recall

services:
  recall-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # The binary comes from the GitHub Release named by RECALL_VERSION, or
      # by this checkout's Cargo.toml when that is unset; see the Dockerfile.
      # RECALL_SOURCE=source builds it from the checkout instead.
      args:
        RECALL_SOURCE: ${RECALL_SOURCE:-release}
        RECALL_VERSION: ${RECALL_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: recall-server
    restart: unless-stopped
    environment:
      RECALL_TOKEN: ${RECALL_TOKEN:?set RECALL_TOKEN in deploy/.env}
      RECALL_PORT: "8787"
      RECALL_DB_PATH: /data/recall.db
      RECALL_BACKUP_DIR: /backups
      RECALL_BACKUP_INTERVAL_HOURS: "24"
      RECALL_BACKUP_KEEP: "7"
      # The address /admin is opened at, such as https://recall.example.com.
      # Passkeys are bound to it; empty leaves passkey sign-in off.
      RECALL_PUBLIC_URL: ${RECALL_PUBLIC_URL:-}
      # Not cosmetic. Rate limiting keys off this header, and rate limiting
      # runs before auth so a flood of invalid tokens is limited too. Traefik
      # sets x-real-ip to the real client address; leave this as the tunnel's
      # cf-connecting-ip and a client can send that header itself, rotate it,
      # and get unlimited attempts at guessing the token.
      #
      # Exactly one header is read, so every other one a client might send is
      # ignored. This holds only while nothing can reach the container except
      # through Traefik — which is what the missing `ports:` below is for.
      RECALL_TRUSTED_IP_HEADER: x-real-ip
    volumes:
      - recall-data:/data
      - ./backups:/backups
    # `expose`, never `ports`. Publishing 8787 to the host would let anyone
    # who can reach the VPS bypass Traefik, send their own x-real-ip, and
    # make the setting above meaningless.
    expose:
      - "8787"
    networks:
      - traefik
      - backend
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Adjust the host to yours.
      traefik.http.routers.recall.rule: Host(`recall.example.com`)
      traefik.http.routers.recall.entrypoints: websecure
      traefik.http.routers.recall.tls: "true"
      traefik.http.routers.recall.tls.certresolver: letsencrypt
      traefik.http.services.recall.loadbalancer.server.port: "8787"

  # The merge worker: an enrolled device that takes conflicting pushes off
  # the server's queue and merges them with the `claude` CLI, so the login
  # that CLI holds is not in the container the internet reaches. It opens
  # no port: no `ports`, no `expose`, no labels, and no ingress network. It
  # reaches the server directly on `backend` and signs every request with
  # its own key, kept on its own volume, never the server's.
  #
  # Off unless asked for: it starts only with COMPOSE_PROFILES=worker in
  # deploy/.env. On first start it prints a code to approve with the `worker`
  # scope; see "The merge worker" in deploy/README.md. Until one is approved
  # the server merges inline, exactly as before.
  recall-worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
      args:
        RECALL_SOURCE: ${RECALL_SOURCE:-release}
        RECALL_VERSION: ${RECALL_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: recall-worker
    restart: unless-stopped
    # A small init as PID 1, so the `claude` processes a merge starts are
    # reaped rather than left as zombies.
    init: true
    environment:
      # Its own variable, never RECALL_URL: that one is the client's, and a
      # machine with Recall set up has it pointing at the public server.
      RECALL_WORKER_SERVER: http://recall-server:8787
    volumes:
      - recall-worker-data:/data
    depends_on:
      - recall-server
    networks:
      - backend

  # Read-only database browser, for the owner's own use. It has no auth of
  # its own, so it is deliberately *not* on the Traefik network and is bound
  # to loopback: reachable only over an SSH tunnel to this machine.
  #
  #   ssh -L 8081:127.0.0.1:8081 user@vps   # then http://localhost:8081
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: recall-sqlite-web
    restart: unless-stopped
    command: sqlite_web -H 0.0.0.0 -p 8080 -x -r /data/recall.db
    volumes:
      - recall-data:/data:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - db-tools

volumes:
  recall-data:
  # The worker's key and its CLI's login. Never mounted into the server.
  recall-worker-data:

networks:
  # Created and owned by Traefik, not by this file.
  traefik:
    external: true
  db-tools:
  # Shared by recall-server and recall-worker only, so the worker can reach
  # the server without going through the ingress. Not `internal`: the
  # worker's `claude` CLI has to reach Anthropic.
  backend:
